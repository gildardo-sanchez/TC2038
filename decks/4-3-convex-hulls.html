## Convexity, segments, convex combinations

<div class="cols">
<div>

- S is **convex** if x ∈ S and y ∈ S imply that the whole **segment xy** ⊆ S.
- The segment xy = all points **αx + βy** with α, β ≥ 0 and α + β = 1. <!-- .element: class="fragment" -->
  - α = 1, β = 0 → x · α = 0, β = 1 → y · α = β = ½ → midpoint
  - x = (1, 0), y = (4, 0): α = β = ½ gives (2.5, 0).
- **Convex combination** of x₁…x<sub>k</sub>: α₁x₁ + … + α<sub>k</sub>x<sub>k</sub>, αᵢ ≥ 0, Σαᵢ = 1. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>All convex combinations of…</h4>
<svg viewBox="0 0 300 110" style="width:100%;max-height:120px">

<p class="small">2 points → a segment · 3 points → a triangle · 4 points in 3-D → a tetrahedron.</p>

## The convex hull: three equivalent definitions

<div class="cols">
<div>

**CH(S)**, also written conv S, is:

1. the set of **all convex combinations** of points of S;
2. the **intersection of all convex sets** that contain S; <!-- .element: class="fragment" -->
3. for a finite S in the plane: the **smallest convex polygon** P that encloses S — there is no other convex polygon P′ with S ⊆ P′ ⊂ P. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Intuition</h4>
<p>Among polygons that enclose the points, the hull's vertices <b>maximize the area while minimizing the perimeter</b> — the rubber band is as tight as possible.</p>
<p class="small muted">Its vertices are always points of S (the <b>extreme points</b>).</p>
</div>
</div>

Note:
⏱ 0:15–0:17. Your slides 12–14.

## The problem

Given a finite set S of n points in the plane, construct the **boundary** of CH(S). Four possible outputs:

1. all the points **on** the hull, in arbitrary order;
2. the **extreme points** (corners), in arbitrary order;
3. all the points on the hull, in **boundary order**;
4. the extreme points, in **boundary order** ← the usual one (clockwise or counter-clockwise).

<div class="cols3 small fragment">
<div class="card"><h4>1970s</h4><p>Gift wrapping / Jarvis march (1970, 1973) · Graham scan (1972) · Quickhull (1977) · Divide & conquer (Preparata–Hong 1977)</p></div>
<div class="card"><h4>1979–1986</h4><p>Monotone chain (Andrew 1979) · Incremental (1984) · Marriage before conquest (Kirkpatrick–Seidel 1986)</p></div>
<div class="card"><h4>1996</h4><p>Chan's algorithm: <b>O(n log h)</b> — optimal in terms of n and the output size h</p></div>
</div>

Note:
⏱ 0:17–0:20. Your slides "The problem" and "Existing algorithms". Outputs 1 vs 2 differ only with collinear points on the boundary — a degenerate case we must always decide how to handle.

## A slow algorithm (de Berg)

An ordered pair (p, q) is a **hull edge** iff all other points lie **to the right** of the directed line pq.

```text [1|2-4|5]
SlowConvexHull(P):
    for every ordered pair (p, q), p ≠ q:
        valid ← true
        for every r ≠ p, q:  if r is LEFT of pq: valid ← false
        if valid: add edge pq
    sort the edges into a polygon
```

<div class="predict" data-answer="3" data-tol="0">
<p class="q">The running time is O(n<sup>?</sup>). Type the exponent.</p>
<p class="explain">n(n−1) pairs × (n−2) tests = <b>O(n³)</b>. Correct but slow — and fragile with collinear points (degeneracy!) and floating point.</p>
</div>

Note:
⏱ 0:20–0:24. Orientation test from session 4.1 again. Degeneracy: if r is ON pq we must decide by whether r lies on the segment.

## Jarvis march

Gift wrapping · R. A. Jarvis, 1973

## Gift wrapping

<div class="cols">
<div>

**Idea:** wrap a gift — keep the paper in contact and go around, surface by surface, until you are back at the start.

- Start at an extreme point (the **lowest**).
- Next point = the one with the **smallest counter-clockwise angle** w.r.t. the previous edge (the horizontal line at the start). <!-- .element: class="fragment" -->
- Compare angles cheaply with the **orientation test**. <!-- .element: class="fragment" -->

</div>
<div class="card">
<h4>Jarvis march</h4>
<p>In 2-D the algorithm is known as Jarvis march, after R. A. Jarvis (1973). Also works in 3-D (Chand & Kapur, 1970), wrapping facet by facet.</p>
<p><b>O(nh)</b>: n points, h hull vertices.</p>
</div>
</div>

Note:
⏱ 0:27–0:30. Your slides 18–20.

## Jarvis: pseudocode and cost

<div class="cols">
<div>

```text
JarvisMarch(P):
    q1 = lowest point of P (ties: leftmost)
    q2 = point with the smallest angle to the
         horizontal line through q1
    i = 2
    repeat
        i = i + 1
        qi = point with the smallest angle to
             the line through q(i−2) and q(i−1)
    until qi = q1
```

</div>
<div>

```cpp
// angles without trigonometry: orientation
int cur = lowest, start = lowest;
do {
    hull.push_back(cur);
    int nxt = (cur + 1) % n;
    for (int r = 0; r < n; r++)
        if (orient(P[cur], P[nxt], P[r]) < 0)
            nxt = r;    // r right of cur→nxt: better
    cur = nxt;
} while (cur != start);
```

<p class="small"><b>O(n)</b> per hull vertex → <b>O(nh)</b>. Output-sensitive: great if h is small, O(n²) if all points are on the hull.</p>

</div>
</div>

Note:
⏱ 0:37–0:40. Your pseudocode slide. The C++ loop never computes an angle: "r is to the right of cur→nxt" means r has a smaller counter-clockwise turn. Collinear points need a tie-break (keep the farthest).

## Graham scan: the idea

<div class="cols">
<div>

1. Find the **lowest** point p0.
2. **Sort** the other points by the angle they make with p0, counter-clockwise. <!-- .element: class="fragment" -->
3. Connect them in that order: a polygon results — usually **not** convex. <!-- .element: class="fragment" -->
4. Now "wrap" that polygon with a convex one: walk it with a **stack**, and whenever the last three points make a **right turn**, the middle one is a dent → pop it. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Left or right?</h4>
<p>orient(a, b, c) &gt; 0 → <span class="ok">left turn</span>: keep b.</p>
<p>orient(a, b, c) ≤ 0 → <span class="bad">right turn</span> (or straight): b is inside, pop it — maybe several times in a row.</p>
</div>
</div>

Note:
⏱ 0:40–0:43. Your "General idea" slide.

## Graham: efficiency

<div class="cols">
<div>

| step | cost |
|---|---|
| 1. find the lowest point | O(n) |
| 2. compute the angles | O(n) |
| 3. sort by angle | **O(n log n)** |
| 4. scan with the stack | O(n) |
| 5. output | O(1)… O(h) |

</div>
<div>

- Each point is **pushed once** and **popped at most once**: every iteration of the scan either eliminates a point (moving partially backward) or advances → at most **2n** iterations.
- Total: **O(n log n)**, dominated by the sort. <!-- .element: class="fragment" -->
- And that is optimal: otherwise we could sort faster than n log n (in a moment). <!-- .element: class="fragment" -->

</div>
</div>

Note:
⏱ 0:52–0:55. Your "Efficiency" slides. Amortized analysis, exactly like the KMP pointer argument in Unit 2.

## A variant without angles: monotone chain

Sort by **x** instead of by angle; build the **upper** hull left → right and the **lower** hull right → left with the same stack rule (Andrew 1979 · de Berg ch. 1).

<div class="w" data-widget="hull" data-algo="andrew" data-n="14" data-h="250"></div>

Note:
⏱ 0:55–0:59. Same stack and turn test as Graham, but sorting by x avoids angles (atan2) and their precision problems — the version most people code. Click "Clear" and add your own points; try collinear points. The code is on the next vertical slide (↓).

## Monotone chain in C++

```cpp [1-2|4-7|8-11]
// points sorted by x (then y); returns hull in counter-clockwise order
vector<Pt> hull(vector<Pt> P) {
    int n = P.size(), k = 0;  vector<Pt> H(2 * n);
    for (int i = 0; i < n; i++) {                       // lower hull
        while (k >= 2 && orient(H[k-2], H[k-1], P[i]) <= 0) k--;
        H[k++] = P[i];
    }
    for (int i = n - 2, t = k + 1; i >= 0; i--) {       // upper hull
        while (k >= t && orient(H[k-2], H[k-1], P[i]) <= 0) k--;
        H[k++] = P[i];
    }
    H.resize(k - 1);  return H;
}
```

<p class="small">Sorting O(n log n); each point pushed once and popped at most once → the loops are O(n). <code>&lt;= 0</code> discards collinear points.</p>

## Can we beat n log n?

<div class="cols">
<div>

**Lower bound by reduction from sorting:** to sort x₁,…,xₙ, map each xᵢ to the point (xᵢ, xᵢ²) on a parabola.

<p class="fragment">All points are on the hull, and walking the hull visits them in <b>sorted order</b>.</p>
<p class="fragment">So a hull algorithm faster than n log n would sort faster than n log n → <b>Ω(n log n)</b>.</p>

</div>
<div>
<div class="card fragment">
<h4>Divide & conquer, too</h4>
<p>Split by the median x, build both hulls recursively, merge them with the upper and lower common tangents in O(n): T(n) = 2T(n/2) + O(n) = <b>O(n log n)</b>.</p>
</div>
<div class="card fragment">
<h4>Output-sensitive optimum</h4>
<p>Kirkpatrick–Seidel (1986) and Chan (1996): <b>O(n log h)</b>.</p>
</div>
</div>
</div>

Note:

## Jarvis or Graham?

| | Jarvis march | Graham scan |
|---|---|---|
| idea | wrap: next point = smallest turn | sort by angle, then remove dents |
| time | **O(nh)** | **O(n log n)** |
| best when | few hull points (h ≪ log n) | large sets, many hull points |
| worst case | O(n²) (all points on the hull) | O(n log n) always |
| intuition | very easy to visualize | needs the stack argument |

<p class="small">Jarvis is more intuitive; Graham is typically preferred for large data sets.</p>

## Polytopes: hulls in 3-D

The convex hull of points in ℝ³ is a **convex polytope**: vertices, edges and polygonal **facets**.

<div class="cols">
<div class="card"><h4>Euler's formula</h4><p>V − E + F = 2</p><p>de Berg Thm 11.1: n vertices → at most <b>3n − 6 edges</b> and <b>2n − 4 facets</b>. Linear size!</p></div>
<div class="card"><h4>Algorithms</h4><p>Gift wrapping in 3-D: O(nF). Randomized incremental: <b>O(n log n)</b> expected (de Berg Thm 11.7). Divide & conquer (Preparata–Hong): O(n log n).</p></div>
</div>

Note:
⏱ 1:07–1:10. In d dimensions the hull can have Θ(n^⌊d/2⌋) facets (upper bound theorem) — the curse of dimensionality. Applications: 3-D collision detection, mesh generation; and next sessions: the Delaunay triangulation is the projection of a 3-D lower hull ("lifting map").

## Duality: points ↔ lines

$$p = (p_x, p_y) \quad\mapsto\quad p^\ast : y = p_x\ x - p_y \qquad \ell : y = m x + b \quad\mapsto\quad \ell^\ast = (m, -b)$$

- **Incidence preserving**: p ∈ ℓ ⇔ ℓ* ∈ p*.
- **Order preserving**: p above ℓ ⇔ ℓ* above p*.

Note:
⏱ 1:12–1:15. de Berg ch. 8.2. Vertical lines have no dual (degeneracy, as usual: rotate slightly).

## Hyperplane arrangements

The **arrangement** A(L) of n lines: the subdivision of the plane into vertices, edges and faces.

| | Simple arrangement of n lines |
|---|---|
| vertices | n(n − 1)/2 |
| edges | n² |
| faces | n²/2 + n/2 + 1 |

- Can be built in **O(n²)** time (incremental, zone theorem). In ℝᵈ: n hyperplanes → Θ(nᵈ) complexity.
- **Upper hull** of P ↔ **lower envelope** of the dual lines P*.
- **Any 3 collinear points?** ⇔ does A(P*) have a vertex where ≥ 3 lines meet? → O(n²) instead of O(n³).

Note:
⏱ 1:21–1:27. de Berg Thm 8.4 and Thm 8.6 (arrangement in O(n²)). Other uses: discrepancy (ray tracing sample quality), half-plane range counting, levels for k-th smallest problems. The 3SUM conjecture says you can't do much better than n² for collinearity.

## Takeaways

- **CH(P)**: smallest convex set ⊇ P; vertices are extreme points of P.
- Slow O(n³) → **Jarvis march O(nh)** (smallest turn, output-sensitive) → **Graham scan O(n log n)** (sort by angle + stack; monotone chain sorts by x); lower bound Ω(n log n).
- **Polytopes** in 3-D have linear size (≤ 3n − 6 edges, ≤ 2n − 4 facets); O(n log n) algorithms exist.
- **Duality** turns points into lines; questions about points become questions about **arrangements** (n² complexity).
