## Convexity

<div class="cols">
<div>

- A set S is **convex** if for any p, q ∈ S the whole segment pq ⊆ S.
- A **convex combination** of x₁…x<sub>k</sub>: α₁x₁ + … + α<sub>k</sub>x<sub>k</sub> with αᵢ ≥ 0 and Σαᵢ = 1.
- **CH(P)** = smallest convex set containing P = intersection of all convex sets containing P = all convex combinations of P.

</div>
<div class="card">
<h4>For a finite set P</h4>
<p>CH(P) is a convex polygon whose vertices are points of P. Output: its vertices <b>in clockwise order</b>.</p>
</div>
</div>

Note:
⏱ 0:07–0:12. Applications: collision detection (hull as a bounding volume), shortest path around an obstacle (it follows the hull), farthest pair (diameter is between two hull vertices), statistics (convex hull peeling, outlier detection), robotics.

## A slow algorithm (de Berg)

An ordered pair (p, q) is a **hull edge** iff all other points lie **to the right** of the directed line pq.

```text [1|2-4|5]
SlowConvexHull(P):
    for every ordered pair (p, q), p ≠ q:
        valid ← true
        for every r ≠ p, q:  if r is LEFT of pq: valid ← false
        if valid: add edge pq
    sort the edges into a polygon
```

<div class="predict" data-answer="3" data-tol="0">
<p class="q">The running time is O(n<sup>?</sup>). Type the exponent.</p>
<p class="explain">n(n−1) pairs × (n−2) tests = <b>O(n³)</b>. Correct but slow — and fragile with collinear points (degeneracy!) and floating point.</p>
</div>

Note:
⏱ 0:12–0:20. Orientation test from session 4.1 again. Degeneracy: if r is ON pq we must decide by whether r lies on the segment.

<p class="explain">No convex combination of other points can have a smaller x. Every algorithm today starts from an extreme point like this.</p>
</div>

## The sweep: upper hull, then lower hull

1. **Sort** points by x.
2. Upper hull: go left → right, appending points. While the **last three do not make a right turn**, delete the middle one. <!-- .element: class="fragment" -->
3. Lower hull: same, right → left. <!-- .element: class="fragment" -->
4. Concatenate. <!-- .element: class="fragment" -->

<p class="fragment small muted">de Berg's ConvexHull — also known as Andrew's monotone chain (1979), a variant of Graham's scan (1972).</p>

Note:
⏱ 0:25–0:28.

## Why O(n log n)?

```cpp [1-2|4-9|10-11]
// points sorted by x (then y); returns hull in counter-clockwise order
vector<Pt> hull(vector<Pt> P) {
    int n = P.size(), k = 0;  vector<Pt> H(2 * n);
    for (int i = 0; i < n; i++) {                       // lower hull
        while (k >= 2 && orient(H[k-2], H[k-1], P[i]) <= 0) k--;
        H[k++] = P[i];
    }
    for (int i = n - 2, t = k + 1; i >= 0; i--) {       // upper hull
        while (k >= t && orient(H[k-2], H[k-1], P[i]) <= 0) k--;
        H[k++] = P[i];
    }
    H.resize(k - 1);  return H;
}
```

<p class="small">Sorting O(n log n). Each point is pushed once and popped at most once → the loops are <b>O(n)</b> in total (amortized).</p>

Note:
⏱ 0:36–0:40. This version builds the lower hull first and returns counter-clockwise order; `<= 0` discards collinear points. de Berg Theorem 1.1.

## Gift wrapping (Jarvis march, 1973)

<div class="w" data-widget="hull" data-algo="jarvis" data-n="14" data-h="290"></div>

Note:
⏱ 0:40–0:47. From the current hull vertex, find the point such that all others are to its left: one full scan (n tests) per hull vertex → O(n·h). Output-sensitive like last session's sweep: excellent when h is small (h = O(log n) beats n log n), terrible when all points are on the hull (O(n²)).

## Can we beat n log n?

<div class="cols">
<div>

**Lower bound by reduction from sorting:** to sort x₁,…,xₙ, map each xᵢ to the point (xᵢ, xᵢ²) on a parabola.

<p class="fragment">All points are on the hull, and walking the hull visits them in <b>sorted order</b>.</p>
<p class="fragment">So a hull algorithm faster than n log n would sort faster than n log n → <b>Ω(n log n)</b>.</p>

</div>
<div class="card fragment">
<h4>Output-sensitive optimum</h4>
<p>Kirkpatrick–Seidel (1986, "marriage before conquest") and Chan (1996): <b>O(n log h)</b>.</p>
</div>
</div>

Note:
⏱ 0:47–0:52. Remind the reduction idea from Unit 1: "if I could solve B fast, I could solve A fast".

## Polytopes: hulls in 3-D

The convex hull of points in ℝ³ is a **convex polytope**: vertices, edges and polygonal **facets**.

<div class="cols">
<div class="card"><h4>Euler's formula</h4><p>V − E + F = 2</p><p>de Berg Thm 11.1: n vertices → at most <b>3n − 6 edges</b> and <b>2n − 4 facets</b>. Linear size!</p></div>
<div class="card"><h4>Algorithms</h4><p>Gift wrapping in 3-D: O(nF). Randomized incremental: <b>O(n log n)</b> expected (de Berg Thm 11.7). Divide & conquer (Preparata–Hong): O(n log n).</p></div>
</div>

Note:
⏱ 0:57–1:03. In d dimensions the hull can have Θ(n^⌊d/2⌋) facets (upper bound theorem) — the curse of dimensionality. Applications: 3-D collision detection, mesh generation; and next sessions: the Delaunay triangulation is the projection of a 3-D lower hull ("lifting map").

---

<!-- .slide: class="checkpoint" -->
<div class="predict" data-answer="6" data-tol="0">
<p class="q">A cube: V = 8, E = 12. Use Euler's formula: how many faces F?</p>
<p class="explain">8 − 12 + F = 2 → <b>F = 6</b>. And a triangulated polytope with 8 vertices would have 2·8 − 4 = 12 triangular facets.</p>
</div>

Note:
⏱ 1:03–1:07. Then ask: and a triangulated polytope with 8 vertices? (2n − 4 = 12 facets, 3n − 6 = 18 edges.)

## Duality: points ↔ lines

$$p = (p_x, p_y) \quad\mapsto\quad p^\ast : y = p_x\ x - p_y \qquad \ell : y = m x + b \quad\mapsto\quad \ell^\ast = (m, -b)$$

- **Incidence preserving**: p ∈ ℓ ⇔ ℓ* ∈ p*.
- **Order preserving**: p above ℓ ⇔ ℓ* above p*.

Note:
⏱ 1:07–1:10. de Berg ch. 8.2. Vertical lines have no dual (degeneracy, as usual: rotate slightly).

## Hyperplane arrangements

The **arrangement** A(L) of n lines: the subdivision of the plane into vertices, edges and faces.

| | Simple arrangement of n lines |
|---|---|
| vertices | n(n − 1)/2 |
| edges | n² |
| faces | n²/2 + n/2 + 1 |

- Can be built in **O(n²)** time (incremental, zone theorem). In ℝᵈ: n hyperplanes → Θ(nᵈ) complexity.
- **Upper hull** of P ↔ **lower envelope** of the dual lines P*.
- **Any 3 collinear points?** ⇔ does A(P*) have a vertex where ≥ 3 lines meet? → O(n²) instead of O(n³).

Note:
⏱ 1:17–1:25. de Berg Thm 8.4 and Thm 8.6 (arrangement in O(n²)). Other uses: discrepancy (ray tracing sample quality), half-plane range counting, levels for k-th smallest problems. The 3SUM conjecture says you can't do much better than n² for collinearity.

## Exit ticket

<div class="quiz" data-answer="1">
<p class="q">Why is Ω(n log n) a lower bound for planar convex hulls?</p>
<ol><li>Sorting reduces to it: lift numbers to a parabola</li><li>Because of the orientation test</li><li>Because of degenerate cases</li><li>Gift wrapping needs it</li></ol>
<p class="explain">A faster hull algorithm would give a faster comparison sort.</p>
</div>

Note:
⏱ 1:33–1:40. Muddiest point. Reading: de Berg 1.1, 8.2–8.3, 11.1; O'Rourke 3.5 (Graham scan) and 4.

---

## Takeaways

- **CH(P)**: smallest convex set ⊇ P; vertices are extreme points of P.
- Slow O(n³) → **sweep (upper + lower hull) O(n log n)** → gift wrapping **O(nh)**; lower bound Ω(n log n).
- **Polytopes** in 3-D have linear size (≤ 3n − 6 edges, ≤ 2n − 4 facets); O(n log n) algorithms exist.
- **Duality** turns points into lines; questions about points become questions about **arrangements** (n² complexity).

<p class="muted small">Next: Voronoi diagrams — the geometry of "who is closest?".</p>
