## Coloring

- A (proper) **k-coloring** assigns one of k colors to each vertex so that **adjacent vertices get different colors**.
- **Chromatic number χ(G)**: the smallest such k. <!-- .element: class="fragment" -->
- Bounds: **ω(G) ≤ χ(G) ≤ Δ(G) + 1** (ω = largest clique, Δ = maximum degree). <!-- .element: class="fragment" -->

<div class="cols small fragment">
<div class="card"><h4>Scheduling</h4><p>Exams, meetings, tasks that share resources.</p></div>
<div class="card"><h4>Frequencies</h4><p>Nearby radio towers / Wi-Fi access points get different channels.</p></div>
<div class="card"><h4>Registers</h4><p>Compilers color the interference graph of variables.</p></div>
<div class="card"><h4>Sudoku</h4><p>81 cells, 9 colors; edges join cells in the same row, column or box.</p></div>
</div>

## Maps, planar graphs and four colors

<div class="cols">
<div>

- **Dual graph** of a map: one vertex per region, an edge if two regions share a border (not just a point).
- **Planar** graph: it *can* be drawn without crossings. Euler: **v − e + f = 2**. <!-- .element: class="fragment" -->
- **Four-color theorem**: every planar graph has χ ≤ 4. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>A long story</h4>
<p>Conjectured by Francis Guthrie (1852) coloring a map of English counties. Proved by <b>Appel & Haken (1976)</b> with a computer checking ~1,900 configurations — the first major computer-assisted proof. Simplified by Robertson, Sanders, Seymour & Thomas (1997), formally verified in Coq (Gonthier, 2005).</p>
</div>
</div>

Note:
⏱ 0:15–0:25. Five colors are easy to prove (Heawood, 1890); four took 124 years. Deciding if a planar graph is 3-colorable is still NP-complete.

## 2-colorable = bipartite

<div class="cols">
<div>

- **Bipartite**: V splits into A and B with every edge between A and B.
- G is 2-colorable ⇔ bipartite ⇔ **no odd cycle**. <!-- .element: class="fragment" -->
- Test in **O(V + E)** with BFS: color by layer parity, check every edge. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>The cliff</h4>
<p>k = 2: linear time.</p>
<p>k = 3: <b>NP-complete</b> (Karp, 1972).</p>
<p>Even approximating χ within n^(1−ε) is NP-hard (Zuckerman, 2006).</p>
</div>
</div>

Note:
⏱ 0:23–0:25.

## Greedy coloring

<div class="cols">
<div>

```text
for each vertex v, in some order:
    give v the smallest color
    not used by its already-colored neighbors
```

- Never uses more than **Δ + 1** colors (a vertex has ≤ Δ neighbors). <!-- .element: class="fragment" -->
- **O(V + E)** per pass (O(V² + E) with a naive scan of colors). <!-- .element: class="fragment" -->
- But the number of colors **depends on the order**. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Your slide's question</h4>
<p>A bipartite graph (χ = 2) colored in the order 1, 5, 2, 6, 3, 7, 4, 8… how many colors will greedy use? Let's see.</p>
</div>
</div>

Note:
⏱ 0:25–0:30.

## Order matters

<div class="w" data-widget="coloring" data-preset="crown" data-h="300"></div>

Note:
⏱ 0:30–0:38. The "crown" graph: Kₙ,ₙ minus a perfect matching (i is not joined to i + 4). In the order 1, 5, 2, 6, … greedy uses 4 colors; in the order 1, 2, 3, 4, 5, … it uses 2 (Welsh–Powell button: all degrees are 3, so it keeps the natural order). For crown graphs on 2n vertices, a bad order forces n colors — greedy can be arbitrarily bad. Yet for EVERY graph there is some order in which greedy is optimal.

## Welsh–Powell (1967) and backtracking

<div class="cols">
<div class="card">
<h4>Welsh–Powell</h4>
<ol class="small"><li>Sort vertices by <b>decreasing degree</b>.</li><li>Give color 1 to the first vertex and to every later vertex not adjacent to one already colored 1.</li><li>Repeat with color 2 on the uncolored ones, and so on.</li></ol>
<p class="small">O(V²). Bound: χ ≤ max over i of min(dᵢ + 1, i).</p>
</div>
<div class="card">
<h4>Exact: backtracking</h4>
<p class="small">Try k = 1, 2, 3, …: assign colors vertex by vertex; if no color fits, undo the last choice (the n-queens pattern from Unit 1). Exponential worst case — it answers "is χ ≤ k?".</p>
</div>
</div>

Note:
⏱ 0:43–0:48. Welsh–Powell = greedy with a smart order (the high-degree vertices are the hardest, color them first). DSatur (Brélaz, 1979) is another popular order: pick the vertex with the most distinct colors among its neighbors.

## Part 2 · The optimal binary search tree

Gilbert & Moore (1959) · Knuth (1971) · CLRS 15.5

---

## Not all keys are equal

<div class="cols">
<div>

A translator looks words up in a BST. "the" is searched a million times, "machicolation" once.

- A **balanced** tree minimizes the worst case…
- …but we want to minimize the **expected** cost of searches. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Input</h4>
<p>Sorted keys k₁ &lt; … &lt; kₙ with probabilities <b>pᵢ</b>, and dummy keys d₀…dₙ (unsuccessful searches between keys) with probabilities <b>qᵢ</b>; Σp + Σq = 1.</p>
<p>Cost of a search = depth + 1. Minimize</p>
<p>E = Σ (depth(kᵢ) + 1)·pᵢ + Σ (depth(dᵢ) + 1)·qᵢ</p>
</div>
</div>

Note:
⏱ 1:03–1:08. Gilbert and Moore studied it in 1959 for variable-length alphabetic binary codes (like Huffman, but the code words must keep the alphabetical order of the symbols) and gave the O(n³) DP. Knuth (1971) showed that the optimal roots are monotone → O(n²).

---

## The DP (CLRS 15.5)

If kᵣ is the root of the optimal tree for keys kᵢ..kⱼ, its two subtrees must be optimal for kᵢ..kᵣ₋₁ and kᵣ₊₁..kⱼ.

$$e[i][j] = \min_{i \le r \le j} \left( e[i][r-1] + e[r+1][j] + w(i, j) \right), \qquad e[i][i-1] = q_{i-1}$$

<p class="small">w(i, j) = pᵢ + … + pⱼ + qᵢ₋₁ + … + qⱼ: hanging both subtrees one level deeper adds the whole probability mass once.</p>

<div class="cols small">
<div class="card fragment"><h4>Order</h4><p>By increasing length l = j − i + 1, exactly like matrix-chain multiplication.</p></div>
<div class="card fragment"><h4>Cost</h4><p>Θ(n²) subproblems × O(n) roots = <b>Θ(n³)</b>; Knuth's monotonicity root[i][j−1] ≤ root[i][j] ≤ root[i+1][j] → <b>O(n²)</b>.</p></div>
</div>

Note:
⏱ 1:08–1:15.

## Exit ticket

<div class="quiz" data-answer="3">
<p class="q">Which pair is correct?</p>
<ol><li>Greedy coloring: always optimal · Optimal BST: greedy by probability</li><li>Welsh–Powell: exact · Optimal BST: O(n log n)</li><li>Greedy coloring: an upper bound ≤ Δ + 1 · Optimal BST: exact DP in Θ(n³), O(n²) with Knuth</li><li>2-coloring: NP-complete · Optimal BST: NP-hard</li></ol>
<p class="explain">Coloring is NP-hard for k ≥ 3 so we settle for bounds and heuristics; the BST problem has optimal substructure and a polynomial DP.</p>
</div>

Note:
⏱ 1:25–1:40. Reading: CLRS 15.5; for coloring, any discrete-math text (e.g. Rosen, §10.8).

---

## Takeaways

- **χ(G)**: fewest colors with adjacent vertices different. ω ≤ χ ≤ Δ + 1. Planar → χ ≤ 4.
- 2-coloring is linear (bipartite test); **3-coloring is NP-complete**.
- **Greedy** depends on the order; **Welsh–Powell** orders by degree; **backtracking** is exact but exponential.
- **Optimal BST**: e[i][j] = min over roots of left + right + w(i, j), **Θ(n³)** (O(n²) with Knuth).
