## The shortest-paths problem (CLRS 24)

- Weighted digraph G = (V, E, w), w: E → ℝ. Path weight w(p) = sum of its edge weights.
- **δ(u, v)** = minimum weight over all paths u ⇝ v (∞ if none). <!-- .element: class="fragment" -->
- Weights can be distance, time, cost, risk… anything that **adds up** along a path. <!-- .element: class="fragment" -->

<div class="cols fragment">
<div class="card"><h4>Negative cycles</h4><p>If a cycle has negative total weight and is reachable, going around it again keeps lowering the cost → δ is <b>undefined</b> (−∞).</p></div>
<div class="card"><h4>Variants</h4><p>Single source (Dijkstra, Bellman–Ford) · single pair · single destination · <b>all pairs</b> (Floyd–Warshall, Johnson).</p></div>
</div>

Note:
⏱ 0:07–0:12. Mention that shortest paths never repeat a vertex when there are no negative cycles: at most |V| − 1 edges.

## Relaxation: the one operation

<div class="cols">
<div>

```cpp
// d[v]: best distance found so far, p[v]: predecessor
void relax(int u, int v, int w) {
    if (d[u] + w < d[v]) {
        d[v] = d[u] + w;
        p[v] = u;
    }
}
```

<p class="small">d[v] is always an <b>upper bound</b> on δ(s, v) and only decreases.</p>

</div>
<div class="card">
<h4>Example (CLRS Fig. 24.9)</h4>
<p>d[u] = 5, w(u, v) = 2, d[v] = 9 → relax → d[v] = 7.</p>
<p>d[u] = 5, w(u, v) = 2, d[v] = 6 → no change.</p>
<p class="muted">Algorithms differ only in <b>which edges they relax, and in what order</b>.</p>
</div>
</div>

Note:
⏱ 0:12–0:17.

## Dijkstra's algorithm (1959)

<div class="cols">
<div>

1. d[s] = 0, all other d = ∞; S = ∅.
2. Repeat: take the vertex **u ∉ S with the smallest d** (EXTRACT-MIN), add it to S.
3. Relax every edge leaving u.

<p class="small">Greedy: once a vertex is extracted, its d is final — <b>provided all weights are ≥ 0</b>.</p>

</div>
<div class="card">
<h4>Edsger W. Dijkstra (1930–2002)</h4>
<p>Theoretical physicist turned programmer at the Mathematisch Centrum, Amsterdam; later at UT Austin. Turing Award 1972. He designed the algorithm in about twenty minutes in a café, without pencil and paper.</p>
</div>
</div>

Note:
⏱ 0:17–0:20. From your slide about Dijkstra. You can stop early when the target is extracted.

<div class="quiz" data-answer="3">
<p class="q">Which data structure makes Dijkstra run in O((V + E) log V)?</p>
<ol><li>A FIFO queue</li><li>A stack</li><li>A binary min-heap keyed by d</li><li>A sorted array of edges</li></ol>
<p class="explain">V EXTRACT-MINs and up to E DECREASE-KEYs, each O(log V). A plain array gives O(V²) (good for dense graphs); a Fibonacci heap O(E + V log V).</p>
</div>

## Why it works — and when it doesn't

**Invariant:** when u is extracted from the queue, d[u] = δ(s, u).

<p>Suppose not: the true shortest path to u leaves S through some edge (x, y) with y ∉ S. Then d[y] = δ(s, y) ≤ δ(s, u) &lt; d[u] — <b>using w ≥ 0</b> — so y would have been extracted before u. Contradiction.</p>

<p class="fragment">The proof breaks if some weights are negative. Press ↓ to see it fail.</p>

--

## Running time

| priority queue | EXTRACT-MIN | DECREASE-KEY | total |
|---|---|---|---|
| unsorted array | O(V) | O(1) | **O(V²)** |
| binary heap | O(log V) | O(log V) | **O((V + E) log V)** |
| Fibonacci heap | O(log V) amortized | O(1) amortized | **O(E + V log V)** |

<p class="small fragment">In C++ the usual trick: priority_queue of (d, v) pairs with "lazy deletion" — push again instead of DECREASE-KEY, and skip stale entries when popped.</p>

```cpp
priority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq;
d[s] = 0;  pq.push({0, s});
while (!pq.empty()) {
    auto [du, u] = pq.top();  pq.pop();
    if (du > d[u]) continue;                 // stale entry
    for (auto [v, w] : adj[u])
        if (d[u] + w < d[v]) { d[v] = d[u] + w;  pq.push({d[v], v}); }
}
```

## Part 2 · All pairs

Floyd–Warshall: dynamic programming over intermediate vertices

## The subproblems

<div class="cols">
<div>

Number the vertices 1..n. Let

**d⁽ᵏ⁾[i][j]** = weight of a shortest path i ⇝ j whose **intermediate** vertices all belong to {1, …, k}.

- d⁽⁰⁾ = W (direct edges only). <!-- .element: class="fragment" -->
- d⁽ⁿ⁾ = the answer. <!-- .element: class="fragment" -->

</div>
<div class="fragment">

Either the best path avoids k, or it goes through k once:

$$d^{(k)}\_{ij} = \min\left(d^{(k-1)}\_{ij},\quad d^{(k-1)}\_{ik} + d^{(k-1)}\_{kj}\right)$$

<p class="small">Both halves i ⇝ k and k ⇝ j only use {1, …, k − 1}: optimal substructure.</p>

</div>
</div>

Note:
⏱ 0:50–0:56. Your slides 10–13. Works with negative edges (no negative cycles); a negative diagonal entry at the end reveals a negative cycle.

## The code: three loops

```cpp
// d starts as W (INF where there is no edge, 0 on the diagonal)
for (int k = 0; k < n; k++)
    for (int i = 0; i < n; i++)
        for (int j = 0; j < n; j++)
            if (d[i][k] < INF && d[k][j] < INF && d[i][k] + d[k][j] < d[i][j])
                d[i][j] = d[i][k] + d[k][j];
```

<div class="cols small">
<div class="card"><h4>Cost</h4><p><b>Θ(n³)</b> time, Θ(n²) space. Tiny constant, trivially correct to code.</p></div>
<div class="card"><h4>vs. n × Dijkstra</h4><p>O(V·E log V): better for sparse graphs with w ≥ 0. Johnson's algorithm reweights to allow negative edges.</p></div>
<div class="card"><h4>Also gives</h4><p>Transitive closure (with OR/AND: Warshall), the path itself (store next[i][j]), negative-cycle detection.</p></div>
</div>

Note:
⏱ 1:06–1:10. The k loop MUST be the outermost. Common bug: putting it inside.

<p class="q">Why must the k loop be the outermost one?</p>
<ol><li>For cache efficiency only</li><li>d⁽ᵏ⁾ needs all of d⁽ᵏ⁻¹⁾: every pair must be finished with intermediates {1..k−1} before k is allowed</li><li>Because i and j are symmetric</li><li>It doesn't matter</li></ol>
<p class="explain">With k inside, d[i][k] might not yet be final when you use it.</p>
</div>

## Takeaways

- **Relaxation** is the common engine; algorithms differ in the order.
- **Dijkstra**: greedy, needs **w ≥ 0**; O((V + E) log V) with a heap, O(V²) with an array.
- **Negative edges** → Bellman–Ford O(VE); negative cycles make δ undefined.
- **Floyd–Warshall**: DP over allowed intermediates, **Θ(n³)**, k outermost.

<p class="muted small">Next: two classic optimization problems — 0/1 knapsack and the traveling salesman.</p>
