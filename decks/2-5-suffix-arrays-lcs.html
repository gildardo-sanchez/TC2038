## Suffix array

The **suffix array** SA of s lists the starting positions of the suffixes of s in **lexicographic order**.

- Stores only n integers — the suffixes themselves are implicit.
- A compact alternative to the **suffix tree** (Weiner 1973): ~4n bytes instead of ~20n. <!-- .element: class="fragment" -->
- With the LCP array it can do almost everything a suffix tree does. <!-- .element: class="fragment" -->

<div class="quiz fragment" data-answer="3">
<p class="q">Naive construction: sort the n suffixes with a comparison sort. Time?</p>
<ol><li>O(n log n)</li><li>O(n²)</li><li>O(n² log n): O(n log n) comparisons, each up to O(n) characters</li><li>O(n³)</li></ol>
<p class="explain">Comparing two suffixes can take O(n) on strings like aaaa…a.</p>
</div>

Note:
⏱ 0:07–0:15.

## Prefix doubling (Manber & Myers idea)

1. Rank suffixes by their **first character**.
2. Given ranks for the first k characters, the first **2k** characters of suffix i are described by the pair **(rank[i], rank[i + k])**. <!-- .element: class="fragment" -->
3. Sort by pairs, re-rank, double k: 1, 2, 4, 8, … until all ranks differ. <!-- .element: class="fragment" -->

<p class="small fragment">log n rounds · each round sorts pairs: O(n log n) with comparison sort → <b>O(n log² n)</b>; O(n) with radix sort → <b>O(n log n)</b>. Linear-time algorithms exist (DC3, SA-IS).</p>

Note:
⏱ 0:15–0:20. Your slides' banana example with a = 1, b = 2, n = 3: T0 = [2 1 3 1 3 1] → pairs (2,1),(1,3),(3,1),(1,3),(3,1),(1,−1) → re-number …

## Searching with a suffix array

All occurrences of P are suffixes that **start with P** → they form a **contiguous block** of SA.

- Two binary searches find the block: **O(m log n)** per query.
- Count = block size; positions = the SA entries in the block.

<p class="small">Build once, query many times — the same "preprocess, then search" pattern as kd-trees (session 4.2).</p>

Note:
⏱ 0:35–0:40. With LCP information it can be O(m + log n).

---

## The LCP array

LCP[i] = length of the longest common prefix of the suffixes at SA[i − 1] and SA[i].

<div class="cols">
<div>

**Kasai et al. (2001)**: compute it in **O(n)** by visiting suffixes in text order; the LCP drops by at most 1 from suffix i to suffix i + 1.

</div>
<div>

| SA | suffix | LCP |
|---|---|---|
| 5 | a | – |
| 3 | ana | 1 |
| 1 | anana | 3 |
| 0 | banana | 0 |
| 4 | na | 0 |
| 2 | nana | 2 |

</div>
</div>

Note:
⏱ 0:40–0:45.

## What SA + LCP give you

<div class="cols">
<div class="card"><h4>Longest repeated substring</h4><p>max LCP → "ana" in banana (length 3).</p></div>
<div class="card"><h4>Number of distinct substrings</h4><p>n(n + 1)/2 − Σ LCP. banana: 21 − 6 = 15.</p></div>
<div class="card"><h4>Pattern search & counting</h4><p>O(m log n) per query.</p></div>
<div class="card"><h4>Longest common substring</h4><p>Of two strings: next part of today.</p></div>
</div>

<p class="small">Used in full-text indexes, data compression (Burrows–Wheeler transform in bzip2), and genome analysis (BWA, Bowtie read aligners).</p>

## Longest common substring

Given X and Y, the longest string that is a **contiguous** substring of both.

<p class="small">ABABC and BABCA → <b>BABC</b> (length 4). Not to be confused with the longest common <i>subsequence</i> (CLRS 15.4), which need not be contiguous.</p>

<div class="cols3 small">
<div class="card fragment"><h4>Naive</h4><p>Every substring of X searched in Y: O(m²·n) or worse.</p></div>
<div class="card fragment"><h4>Dynamic programming</h4><p>O(mn) time and space (O(min) space with two rows).</p></div>
<div class="card fragment"><h4>Suffix array of X#Y</h4><p>O((m + n) log(m + n)), or linear with a linear SA.</p></div>
</div>

Note:
⏱ 1:00–1:04. Your LC_Substring slides.

## DP: longest common suffix

$$L[i][j] = \begin{cases} L[i-1][j-1] + 1 & X_i = Y_j \\\\ 0 & \text{otherwise} \end{cases} \qquad \text{answer} = \max_{i,j} L[i][j]$$

<div class="w" data-widget="lcsdp" data-a="ABABC" data-b="BABCA"></div>

Note:
⏱ 1:04–1:12. L[i][j] is the longest common SUFFIX of the prefixes X[1..i] and Y[1..j]; the longest common substring is the max over all cells. The diagonal of the maximum cell spells the answer (green). Try your ABAB / BABA example.

## With a suffix array of X # Y %

<div class="w" data-widget="lcssa" data-a="ABABC" data-b="BABCA"></div>

Note:
⏱ 1:12–1:22. A common substring = a common prefix of a suffix from X and a suffix from Y. Scan adjacent SA rows: when one suffix comes from X and the other from Y, their LCP is a candidate. # stops common prefixes from running from X into Y.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">Why must the separator # in X#Y not appear in X or Y?</p>
<ol><li>To make the string sortable</li><li>To keep n even</li><li>So that no common prefix can extend across the boundary between X and Y</li><li>It may appear; it's just for readability</li></ol>
<p class="explain">Otherwise an LCP could include characters of both strings and report a "substring" that exists in neither.</p>
</div>

## Exit ticket

<div class="quiz" data-answer="2">
<p class="q">To find all occurrences of P in a text with a suffix array, we…</p>
<ol><li>scan the whole SA</li><li>binary-search the contiguous block of suffixes that start with P</li><li>hash every suffix</li><li>compute the Z-function of each suffix</li></ol>
<p class="explain">O(m log n) per query after O(n log n) preprocessing.</p>
</div>
