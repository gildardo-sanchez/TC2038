# A* and IDA*

### Informed search: let a good guess guide the way

<p class="byline">Dr. Gildardo Sánchez Ante · Tecnológico de Monterrey<br><span class="tiny">Russell & Norvig, <i>AI: A Modern Approach</i>, §3.5–3.6 · Hart, Nilsson & Raphael (1968) · Korf (1985)</span></p>

You must reach the exit **G** from **S**. You can't see the walls ahead, but you know **where G is**.

<div class="quiz" data-answer="3">

<p class="explain">"Cost so far + estimated cost to go": that's exactly A*'s f(n) = g(n) + h(n).</p>
</div>

## Best-first search

Expand the frontier node with the smallest **evaluation function** f(n):

<div class="cols3">
<div class="card fragment"><h4>Uniform cost</h4><p>f(n) = g(n)</p><p class="muted">cost so far — blind, optimal</p></div>
<div class="card fragment"><h4>Greedy best-first</h4><p>f(n) = h(n)</p><p class="muted">estimated cost to go — fast, not optimal</p></div>
<div class="card fragment"><h4>A*</h4><p>f(n) = g(n) + h(n)</p><p class="muted">estimated cost of the cheapest solution through n</p></div>
</div>

<p class="fragment small">h(n) is a <b>heuristic</b>: problem-specific knowledge, e.g., straight-line or Manhattan distance to the goal.</p>

Note:
⏱ 0:05–0:12. A* was invented for the Shakey robot at SRI (Hart, Nilsson, Raphael, 1968).

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">On the "wall" map, why does greedy best-first expand so many cells?</p>
<ol><li>Because it's breadth-first</li><li>It ignores g(n): it rushes toward G, hits the wall, and must flood around it</li><li>Because Manhattan distance is wrong</li><li>It doesn't — it's always optimal</li></ol>
<p class="explain">Greedy only looks at the estimate; it can get trapped and return long paths.</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="1">
<p class="q">With h(n) = 0 for every node, A* behaves like…</p>
<ol><li>Uniform-cost search (Dijkstra)</li><li>Greedy best-first</li><li>DFS</li><li>IDS</li></ol>
<p class="explain">f = g. A* generalizes Dijkstra; a good h focuses the search toward the goal.</p>
</div>

## When is A* optimal?

<div class="cols">
<div>

**Admissible:** h never overestimates.

$$h(n) \le h^\ast(n) \quad \text{(true cost to the goal)}$$

**Consistent (monotone):** triangle inequality.

$$h(n) \le c(n, n') + h(n')$$

</div>
<div class="card">
<h4>Theorems (R&N §3.5)</h4>
<p>Tree search: admissible ⇒ A* optimal.</p>
<p>Graph search: consistent ⇒ A* optimal, and f never decreases along a path.</p>
<p>Consistent ⇒ admissible.</p>
</div>
</div>

Note:
⏱ 0:33–0:40. Intuition: an optimistic h never lets A* close the door on the optimal path. Proof sketch: when a suboptimal goal G2 is popped, some node n on the optimal path is in the frontier with f(n) ≤ C* < f(G2) — contradiction.

---

## Contours, efficiency, cost

<div class="cols">
<div>

- A* expands all nodes with f(n) &lt; C* and some with f(n) = C*: its explored region looks like **contours** stretched toward the goal.
- **Optimally efficient**: no optimal algorithm with the same h expands fewer nodes (up to ties).
- **Problem: memory.** A* keeps every generated node — exponential space.

</div>
<div class="card">
<h4>Weighted A*</h4>
<p>f = g + w·h (w &gt; 1): explores far less, and the solution costs at most <b>w × optimal</b>. Used in games and robotics when "good enough, now" wins.</p>
</div>
</div>

Note:
⏱ 0:40–0:50. Video games (pathfinding), GPS routing (with landmarks/contraction hierarchies), robotics, puzzle solving, NLP decoding.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="4">
<p class="q">Grid with 4-neighbor moves of cost 1. Which heuristic is <b>not</b> admissible?</p>
<ol><li>Manhattan distance</li><li>Euclidean distance</li><li>h = 0</li><li>2 × Manhattan distance</li></ol>
<p class="explain">It can overestimate (e.g., by 2× in an open field), so A* may return a suboptimal path — that's weighted A*.</p>
</div>

## Designing heuristics: the 8-puzzle

<div class="cols">
<div>

- **h₁** = number of misplaced tiles.
- **h₂** = sum of Manhattan distances of tiles to their goal squares.
- Both are exact costs of **relaxed problems** (tiles can jump anywhere / tiles can move through each other) ⇒ admissible.
- h₂ ≥ h₁ always: h₂ **dominates** h₁ ⇒ A* with h₂ never expands more nodes.

</div>
<div>

| depth d | IDS | A*(h₁) | A*(h₂) |
|---|---|---|---|
| 6 | 680 | 20 | 18 |
| 12 | 3,644,035 | 227 | 73 |
| 24 | — | 39,135 | 1,641 |

<p class="tiny muted">Average nodes generated, R&N Fig. 3.29.</p>

</div>
</div>

Note:
⏱ 0:55–1:05. 9!/2 = 181,440 reachable states. Pattern databases (store exact costs of sub-puzzles) push this much further: they solve the 15-puzzle and Rubik's cube optimally.

## IDA*: iterative deepening A*

<div class="cols">
<div>

1. bound ← h(start)
2. DFS, but prune any node with **f = g + h &gt; bound**.
3. Not found? bound ← **smallest f that exceeded it**; repeat.

</div>
<div class="card">
<h4>Why?</h4>
<p>Same optimality as A* (admissible h), but memory <b>O(d)</b> instead of exponential. Korf (1985): first optimal solutions of random 15-puzzles.</p>
</div>
</div>

```cpp
int search(int g, int bound) {            // returns FOUND or the next bound
    int f = g + h(state);
    if (f > bound) return f;
    if (isGoal(state)) return FOUND;
    int next = INF;
    for (move m : moves(state)) { apply(m); int t = search(g + 1, bound); undo(m);
        if (t == FOUND) return FOUND;  next = min(next, t); }
    return next;
}
```

Note:
⏱ 1:05–1:12. Exactly IDS from session 5.1 with "depth" replaced by "f-cost".

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">In IDA*, the bound for the next iteration is…</p>
<ol><li>bound + 1</li><li>the smallest f-value that exceeded the current bound</li><li>twice the current bound</li><li>h(start)</li></ol>
<p class="explain">That guarantees no solution with a smaller cost was skipped.</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">You need the optimal solution of a 15-puzzle on a machine with little RAM. Choose:</p>
<ol><li>BFS</li><li>A* with h₂</li><li>IDA* with h₂</li><li>Greedy best-first</li></ol>
<p class="explain">A* runs out of memory (10¹³ states); IDA* uses O(d) memory and is optimal with an admissible h.</p>
</div>

## Exit ticket

<div class="quiz" data-answer="1">
<p class="q">A* with an admissible heuristic is guaranteed to…</p>
<ol><li>find an optimal solution (tree search)</li><li>use polynomial memory</li><li>expand fewer nodes than greedy best-first</li><li>run in polynomial time</li></ol>
<p class="explain">Optimality yes; memory and time can still be exponential.</p>
</div>

## Takeaways

- **A***: expand the node with smallest **f = g + h**. h = 0 → Dijkstra; ignore g → greedy.
- **Admissible** (tree) / **consistent** (graph) h ⇒ **optimal**.
- Better heuristics (dominating, from **relaxed problems**) ⇒ dramatically fewer nodes.
- **IDA***: A*'s optimality with **O(d)** memory, by deepening on f.

<p class="muted small">Next: when the state space is too large even for A* — local search and metaheuristics.</p>
