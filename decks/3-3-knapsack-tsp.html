## 0/1 knapsack

- n items, item i has integer **weight wᵢ** and **benefit bᵢ**; capacity **W**.
- Choose T ⊆ {1..n} maximizing Σ bᵢ subject to Σ wᵢ ≤ W. <!-- .element: class="fragment" -->
- "0/1": each item is taken entirely or not at all. <!-- .element: class="fragment" -->

<div class="cols fragment">
<div class="card"><h4>Brute force</h4><p>Try all 2ⁿ subsets: <b>O(2ⁿ · n)</b>. n = 60 → 10¹⁸ subsets.</p></div>
<div class="card"><h4>Greedy by value/weight?</h4><p>Optimal for the <b>fractional</b> knapsack (CLRS 16.2), wrong for 0/1: W = 50, items (10, 60), (20, 100), (30, 120). Greedy takes 1 + 2 → 160; optimum 2 + 3 → 220.</p></div>
</div>

Note:
⏱ 0:05–0:10. Unit 1 (greedy session) already showed this counterexample: quick recall.

## The recurrence

**B[k][w]** = best value using items 1..k with capacity w.

$$B[k][w] = \begin{cases} B[k-1][w] & \text{if } w_k > w \\\\ \max\left(B[k-1][w],\quad b_k + B[k-1][w - w_k]\right) & \text{otherwise} \end{cases}$$

<div class="cols small">
<div class="card fragment"><h4>Skip item k</h4><p>Best with the first k − 1 items and the same capacity.</p></div>
<div class="card fragment"><h4>Take item k</h4><p>Its value, plus the best with the first k − 1 items in the capacity that's left.</p></div>
<div class="card fragment"><h4>Base cases</h4><p>B[0][w] = 0 and B[k][0] = 0.</p></div>
</div>

Note:
⏱ 0:15–0:20.

## Code and cost

```cpp
int knapsack(int W, const vector<int>& wt, const vector<int>& b) {
    int n = wt.size();
    vector<vector<int>> B(n + 1, vector<int>(W + 1, 0));
    for (int k = 1; k <= n; k++)
        for (int w = 0; w <= W; w++) {
            B[k][w] = B[k - 1][w];                                    // skip item k
            if (wt[k - 1] <= w)
                B[k][w] = max(B[k][w], b[k - 1] + B[k - 1][w - wt[k - 1]]);  // take it
        }
    return B[n][W];
}
```

<div class="cols small">
<div class="card"><h4>Cost</h4><p><b>Θ(n·W)</b> time and space; Θ(W) space keeping one row and iterating w downward.</p></div>
<div class="card fragment"><h4>Polynomial?</h4><p>No: W is written with log W bits, so n·W is <b>exponential in the input size</b> → <b>pseudo-polynomial</b>. Knapsack is NP-hard.</p></div>
</div>

Note:
⏱ 0:30–0:35. Your slide 19: plain recursion recomputes the same (k, w) pairs — memoization or the table fixes it.

<p class="q">The DP for 0/1 knapsack runs in Θ(nW). With n = 100 items and W = 10¹², it is…</p>
<ol><li>fast: it's polynomial</li><li>fast: n is small</li><li>hopeless: 10¹⁴ cells — the running time grows with the value of W, not with its number of digits</li><li>impossible: knapsack is undecidable</li></ol>
<p class="explain">Pseudo-polynomial. Here, branch and bound (Unit 1) or meet in the middle (Unit 5) are better options.</p>

## Part 2 · The traveling salesman

Visit every city once and come back, as cheaply as possible

## TSP

<div class="cols">
<div>

- Given cities c₁…cₙ and a cost d(cᵢ, cⱼ) for each pair, find a **Hamiltonian cycle of minimum total cost**.
- **Symmetric** (d(i, j) = d(j, i)) or **asymmetric**. <!-- .element: class="fragment" -->
- **Metric** if the triangle inequality holds. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Everywhere</h4>
<p>Delivery routes (UPS, FedEx), drilling circuit boards, X-ray crystallography (orient a crystal), genome sequencing, telescope scheduling, warehouse picking, video compression.</p>
</div>
</div>

<p class="fragment small">NP-hard (Karp, 1972). Number of distinct tours: <b>(n − 1)!/2</b>. 20 cities → about 6·10¹⁶.</p>

Note:
⏱ 0:40–0:46. Your slides 2–7. Record: an 85,900-city instance solved optimally (Applegate et al., 2006) using LP + branch and cut.

## The heuristics, precisely

<div class="cols">
<div class="card"><h4>Nearest neighbor</h4><p>From the start, always go to the nearest unvisited city; return at the end. O(n²).</p></div>
<div class="card"><h4>Repetitive NN</h4><p>Run NN from every city, keep the cheapest tour. O(n³).</p></div>
<div class="card"><h4>Cheapest link</h4><p>Take edges by increasing cost; skip any edge that gives a vertex degree 3 or closes a cycle before all cities are included. O(n² log n) — Kruskal-like (next session!).</p></div>
</div>

<p class="small fragment">With guarantees (metric TSP): MST doubling → ≤ 2·OPT (CLRS 35.2); Christofides (1976) → ≤ 1.5·OPT. Improvement heuristics: 2-opt, Lin–Kernighan; metaheuristics from Unit 5: SA, GA, ACO.</p>

Note:
⏱ 1:00–1:04.

## Exact: Held–Karp dynamic programming (1962)

<div class="cols">
<div>

**C(S, j)** = cheapest path that starts at city 1, visits every city in S exactly once, and ends at j ∈ S.

$$C(S, j) = \min_{i \in S \setminus \lbrace j \rbrace} C(S \setminus \lbrace j \rbrace, i) + d(i, j)$$

<p class="small">Answer: min over j of C(all, j) + d(j, 1).</p>

</div>
<div>

| n | n! | n² 2ⁿ |
|---|---|---|
| 10 | 3.6·10⁶ | 1.0·10⁵ |
| 20 | 2.4·10¹⁸ | 4.2·10⁸ |
| 30 | 2.7·10³² | 9.7·10¹¹ |

<p class="small"><b>O(n²·2ⁿ)</b> time, O(n·2ⁿ) space: still exponential, but n = 20 becomes feasible — S is a bitmask (Unit 5).</p>

</div>
</div>

Note:
⏱ 1:04–1:10. Same DP pattern as knapsack: what have I used so far (a set instead of a capacity) and where am I.

## Held–Karp in C++

```cpp
// d: n×n cost matrix, city 0 is the start
vector<vector<int>> C(1 << n, vector<int>(n, INF));
C[1][0] = 0;
for (int S = 1; S < (1 << n); S++) if (S & 1)
    for (int j = 0; j < n; j++) if ((S >> j & 1) && C[S][j] < INF)
        for (int k = 0; k < n; k++) if (!(S >> k & 1))
            C[S | 1 << k][k] = min(C[S | 1 << k][k], C[S][j] + d[j][k]);
int best = INF;
for (int j = 1; j < n; j++) best = min(best, C[(1 << n) - 1][j] + d[j][0]);
```

## Exit ticket

<div class="quiz" data-answer="2">
<p class="q">What do the knapsack DP and Held–Karp have in common?</p>
<ol><li>Both are polynomial</li><li>Both index subproblems by "what I have used so far" (capacity or set of cities) plus a little state, and both are exponential in the input size</li><li>Both are greedy</li><li>Both need non-negative weights</li></ol>
<p class="explain">Θ(nW) is exponential in log W; O(n²2ⁿ) is exponential in n. Still, both are vastly better than brute force.</p>
</div>

## Takeaways

- **0/1 knapsack**: B[k][w] = max(skip, take); **Θ(nW)**, pseudo-polynomial; the right subproblem needs the capacity.
- **TSP**: (n − 1)!/2 tours; NP-hard.
- Heuristics (**NN, repetitive NN, cheapest link**) are fast upper bounds with no guarantee.
- **Held–Karp**: DP over subsets, **O(n²2ⁿ)**.
