## The toolbox

<div class="cols3">
<div class="card fragment"><h4>Brute force</h4><p>Try every possibility.</p></div>
<div class="card fragment"><h4>Divide & conquer</h4><p>Split, solve the parts, combine.</p></div>
<div class="card fragment"><h4>Greedy</h4><p>Take the best-looking choice now.</p></div>
<div class="card fragment"><h4>Dynamic programming</h4><p>Solve overlapping subproblems once, remember them.</p></div>
<div class="card fragment"><h4>Backtracking</h4><p>Explore a tree of choices, abandon dead ends early.</p></div>
<div class="card fragment"><h4>Branch & bound</h4><p>Backtracking + bounds to discard non-promising branches.</p></div>
</div>

Note:

## Brute force

> Rely on raw processing power: test **all** possibilities.

- Padlock: up to 10ⁿ attempts for n digits.
- String search: pattern of length m in a text of length n → up to **n · m** character comparisons.

```cpp [1-2|3-6]
int naiveSearch(const string& text, const string& pat) {
    int n = text.size(), m = pat.size();
    for (int i = 0; i + m <= n; i++) {        // every alignment
        int j = 0;
        while (j < m && text[i + j] == pat[j]) j++;
        if (j == m) return i;
    }
    return -1;
}
```

Note:
⏱ 0:10–0:15. Brute force is the baseline every other technique is compared against. It is also often correct and simple, so it's a great test oracle. Mention the energy cost: more computation = more energy (sustainability objective of the course). KMP (Unit 2) will improve string search to O(n + m).

## Divide and conquer

<div class="cols3">
<div class="card fragment"><h4>1 · Divide</h4><p>Break the problem into smaller subproblems.</p></div>
<div class="card fragment"><h4>2 · Conquer</h4><p>Solve each subproblem (recursively).</p></div>
<div class="card fragment"><h4>3 · Combine</h4><p>Merge the partial solutions.</p></div>
</div>

<p class="fragment">Keep splitting until the subproblem becomes <b>trivially different</b>: sorting one element is not sorting at all.</p>

Note:
⏱ 0:15–0:18. Merge sort: sorting 1 value is trivial; sorting 2 values is a single conditional swap.

## Greedy algorithms

- At each step, pick the option that **maximizes the immediate gain**.
- Short-sighted: "get the most I can get *now*". <!-- .element: class="fragment" -->
- Can fall into a **local optimum**. <!-- .element: class="fragment" -->
- Usually **cheap** to compute. Dijkstra's shortest paths is greedy. <!-- .element: class="fragment" -->

Note:
⏱ 0:25–0:28.

---

## Making change, greedily

<p class="small">Rule: always take the <b>largest coin that fits</b>.</p>

<div class="w" data-widget="change" data-coins="1,5,10,25" data-amount="63"></div>

Note:
⏱ 0:28–0:35. Start with US coins (greedy optimal). Then click "Darsek (1,7,10) · 15": greedy uses 6 coins, optimal 3. Then "(1,3,4) · 6". Ask: "So, why would anyone use greedy?" → it's fast, and for some problems we can PROVE it's optimal (Huffman, Dijkstra, Prim, Kruskal). When the problem is intractable, a greedy heuristic may give a near-optimal answer quickly.

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">Coins {1, 6, 10}. Amount 12. What does the greedy algorithm return?</p>
<ol>
<li>2 coins: 6 + 6</li>
<li>2 coins: 10 + 2</li>
<li>3 coins: 10 + 1 + 1</li>
<li>12 coins of 1</li>
</ol>
<p class="explain">Greedy grabs 10 and is left with 2 → 1 + 1. The optimum is 6 + 6 (2 coins). Greedy choices are <b>irrevocable</b>.</p>
</div>

Note:
⏱ 0:35–0:37.

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">Merge sort is divide-and-conquer. In which step is most of the work done?</p>
<ol>
<li>Divide: choosing the split point</li>
<li>Combine: merging two sorted halves</li>
<li>The base case</li>
<li>The work is equal in all steps</li>
</ol>
<p class="explain">Splitting is O(1) (compute the middle). Merging two halves of total size n costs up to n − 1 comparisons — that's where the n log n comes from.</p>
</div>

Note:
⏱ 0:37–0:40. Contrast with quicksort, where the hard work is in the divide step (partition).

## Dynamic programming

- Break the problem into slightly smaller subproblems that **overlap**.
- Plain recursion solves the same subproblem **over and over**. <!-- .element: class="fragment" -->
- DP **stores** each answer the first time and reuses it. <!-- .element: class="fragment" -->

Note:
⏱ 0:40–0:42.

---

## The classic: Fibonacci

```cpp
long long fib(int n) {
    if (n < 2) return n;              // F(0) = 0, F(1) = 1
    return fib(n - 1) + fib(n - 2);
}
```

<div class="predict" data-answer="25" data-tol="0">
<p class="q">How many calls does <code>fib(6)</code> make in total (including itself)?</p>
<p class="explain">25 calls. In general calls(n) = 2·F(n+1) − 1, which grows like 1.618ⁿ. <code>fib(40)</code> makes 331,160,281 calls!</p>
</div>

Note:
⏱ 0:42–0:45. "Neat" code, horrible performance. Let them guess before showing the tree.

## Two ways to do DP

<div class="cols">
<div>

**Top-down (memoization)**

```cpp
vector<long long> memo(N, -1);
long long fib(int n) {
    if (n < 2) return n;
    if (memo[n] != -1) return memo[n];
    return memo[n] = fib(n-1) + fib(n-2);
}
```

</div>
<div>

**Bottom-up (tabulation)**

```cpp
long long fib(int n) {
    vector<long long> F(n + 1);
    F[0] = 0; if (n > 0) F[1] = 1;
    for (int i = 2; i <= n; i++)
        F[i] = F[i-1] + F[i-2];
    return F[n];
}
```

</div>
</div>

Note:
⏱ 0:53–0:58. Top-down: keep the recursive structure, check the table before computing. Bottom-up: start at the base cases and explicitly go up. Challenge: bottom-up Fibonacci only needs the last two values → O(1) space.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="4">
<p class="q">Dynamic programming pays off when subproblems…</p>
<ol>
<li>are independent of each other</li>
<li>are all of size 1</li>
<li>can be solved greedily</li>
<li>overlap: the same subproblem appears many times</li>
</ol>
<p class="explain">With independent subproblems (merge sort) there is nothing to reuse: use divide and conquer. Overlap is what DP exploits.</p>
</div>

Note:
⏱ 0:58–1:00.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="1">
<p class="q">Memoized <code>fib(n)</code>: time and extra space?</p>
<ol>
<li>Θ(n) time, Θ(n) space</li>
<li>Θ(n) time, Θ(1) space</li>
<li>Θ(2ⁿ) time, Θ(n) space</li>
<li>Θ(log n) time, Θ(n) space</li>
</ol>
<p class="explain">Each F(k) is computed once (n values, O(1) work each) and stored in a table of n + 1 entries (plus the recursion stack, also Θ(n)).</p>
</div>

Note:
⏱ 1:00–1:03.

## Backtracking

An **optimized exhaustive search**: walk the tree of possibilities depth-first and **abandon a branch** as soon as it cannot lead to a solution.

Note:
⏱ 1:03–1:05.

---

## The 8-queens puzzle

Place 8 queens so that **no two attack each other** (row, column or diagonal).

<div class="w" data-widget="queens" data-n="6"></div>

Note:
⏱ 1:05–1:12. Start with 6×6 (faster). Then switch to 8×8 and use speed 9–10 or "Jump to end": 876 placements tried instead of 8⁸ = 16,777,216 brute-force configurations. The key detail: most of the time we discover at column 3 or 4 that the current path won't work, and we save exploring the subtree.

---

## When is backtracking a good choice?

- **Decision problems**: find *one* feasible solution (Sudoku, N-queens).
- **Enumeration**: list *all* feasible solutions.
- **Optimization**: combined with bounds → branch & bound.

<p class="callout warn">Worst case is still exponential. It shines when constraints let us prune early.</p>

Note:
⏱ 1:12–1:15.

---

## Branch and bound

<div class="cols">
<div>

- For **combinatorial optimization** (minimize / maximize).
- Exponential in the worst case…
- …but adds a **bound** for each node and the **best solution so far**.

</div>
<div class="card">
<h4>Pruning rule</h4>
<p>If the <b>best value reachable</b> from a node is not better than the <b>best solution found</b>, discard the whole subtree.</p>
</div>
</div>

<p class="small muted">Good for: 0/1 integer programming, knapsack, TSP, SAT, network problems.</p>

Note:
⏱ 1:15–1:22. B&B can be seen as an optimization over backtracking. Full session coming with the knapsack example.

## Cheat sheet

| Technique | Key idea | Typical cost | Watch out |
|---|---|---|---|
| Brute force | try everything | exponential / n! | only tiny n |
| Divide & conquer | split · solve · combine | n log n | needs good combine |
| Greedy | best local choice | n log n | may be wrong |
| Dynamic programming | store overlapping subproblems | poly (table size) | memory |
| Backtracking | DFS + abandon dead ends | exponential worst | pruning quality |
| Branch & bound | backtracking + bounds | exponential worst | bound quality |

## Exit ticket

<div class="quiz" data-answer="3">
<p class="q">What does branch & bound add on top of backtracking?</p>
<ol><li>Memoization of subproblems</li><li>A greedy choice at every node</li><li>An optimistic bound per node + the best solution found so far</li><li>Random restarts</li></ol>
<p class="explain">Compare the node's bound with the incumbent; if it can't beat it, prune.</p>
</div>
