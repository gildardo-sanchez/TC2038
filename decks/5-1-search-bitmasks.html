## State-space search

A problem is described by:

<div class="cols3">
<div class="card"><h4>States</h4><p>Initial state, goal test.</p></div>
<div class="card"><h4>Actions & transition model</h4><p>What can I do, and where does it take me?</p></div>
<div class="card"><h4>Path cost</h4><p>Sum of step costs.</p></div>
</div>

- **Expand** a node = generate its children. **Test** = is it a goal? <!-- .element: class="fragment" -->
- Nodes are **undiscovered**, in the **frontier** (open, fringe), or **expanded** (closed). <!-- .element: class="fragment" -->
- A *node* is a data structure (state, parent, action, g); a *state* is a configuration. <!-- .element: class="fragment" -->

Note:
⏱ 0:07–0:12. All blind strategies are the same loop; they differ ONLY in which frontier node is expanded next.

---

## Four criteria

| Criterion | Question |
|---|---|
| **Completeness** | Does it always find a solution when one exists? |
| **Optimality** | Does it find the lowest-cost solution? |
| **Time** | How many nodes are generated? |
| **Space** | How many nodes in memory at once? |

<p class="small">Measured with <b>b</b> = branching factor, <b>d</b> = depth of the shallowest goal, <b>m</b> = maximum depth.</p>

Note:
⏱ 0:12–0:15.

## The price of breadth

<div class="cols">
<div>

BFS generates 1 + b + b² + … + b<sup>d</sup> = **O(b<sup>d</sup>)** nodes — and keeps them all.

| depth | nodes | time | memory |
|---|---|---|---|
| 8 | 10⁸ | 2 min | 103 GB |
| 10 | 10¹⁰ | 3 h | 10 TB |
| 12 | 10¹² | 13 days | 1 PB |
| 16 | 10¹⁶ | 350 years | 10 EB |

</div>
<div class="card">
<h4>Lesson (Russell & Norvig)</h4>
<p>b = 10, one million nodes/s, 1 KB per node. <b>Memory runs out long before time does.</b></p>
</div>
</div>

Note:
⏱ 0:25–0:30. R&N, Fig. 3.13. Exponential-complexity search problems cannot be solved by uninformed methods for any but the smallest instances.

<ol><li>FIFO queue</li><li>LIFO stack (or recursion)</li><li>Priority queue by path cost</li><li>Hash set</li></ol>
<p class="explain">The deepest (most recently generated) node is expanded next.</p>
</div>

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">DFS on a tree with b = 3 and maximum depth m = 20 keeps at most how many nodes in memory?</p>
<ol><li>3²⁰</li><li>20</li><li>about b·m = 60</li><li>1</li></ol>
<p class="explain">One path of length m plus the unexplored siblings along it: O(bm). That's DFS's big advantage.</p>
</div>

## Depth-limited & iterative deepening

<div class="cols">
<div>

**Depth-limited (DLS):** DFS that doesn't expand below depth ℓ. Outcomes: solution · failure · **cutoff**.

**Iterative deepening (IDS):** run DLS with ℓ = 0, 1, 2, … until a solution appears.

</div>
<div class="card">
<h4>Best of both worlds</h4>
<p>Complete and optimal (unit costs) like BFS, memory <b>O(bd)</b> like DFS.</p>
</div>
</div>

Note:
⏱ 0:35–0:43. Press ↓ for the animation. Play: the dashed orange line marks the current depth limit. Upper levels are regenerated every iteration — is that wasteful?

## Isn't IDS wasteful?

Nodes generated: $d\ b + (d-1)\ b^2 + \dots + 1 \cdot b^d = O(b^d)$

<div class="predict" data-answer="123450" data-tol="0">
<p class="q">b = 10, d = 5: IDS generates 5·10 + 4·100 + 3·1,000 + 2·10,000 + 1·100,000 = ?</p>
<p class="explain"><b>123,450</b> nodes vs 111,110 for BFS: only ~11% more, with exponentially less memory. Most nodes live at the bottom level, which IDS generates only once. R&N: "IDS is the preferred uninformed method when the search space is large and the depth of the solution is unknown."</p>
</div>

Note:
⏱ 0:43–0:47. Your slides prove the bound b^d (b/(b−1))².

## Uniform-cost search & the summary

<p class="small"><b>Uniform cost (Dijkstra):</b> expand the frontier node with the smallest path cost g(n) — priority queue. Optimal for any positive step costs.</p>

| | BFS | Uniform cost | DFS | Depth-limited | IDS | Bidirectional |
|---|---|---|---|---|---|---|
| Complete? | yes¹ | yes¹² | no | no | yes¹ | yes¹ |
| Optimal? | yes³ | yes | no | no | yes³ | yes³ |
| Time | b<sup>d</sup> | b<sup>1+⌊C*/ε⌋</sup> | b<sup>m</sup> | b<sup>ℓ</sup> | b<sup>d</sup> | b<sup>d/2</sup> |
| Space | b<sup>d</sup> | b<sup>1+⌊C*/ε⌋</sup> | bm | bℓ | bd | b<sup>d/2</sup> |

<p class="tiny muted">¹ b finite · ² step costs ≥ ε &gt; 0 · ³ all step costs equal. (R&N, Fig. 3.21)</p>

Note:
⏱ 0:47–0:52. Bidirectional: two searches meeting in the middle — b^(d/2) + b^(d/2) ≪ b^d. Same idea as "meet in the middle" next session!

## Bitmasks: a set in one integer

A subset of {0, 1, …, n−1} ↔ an n-bit integer: bit i = 1 ⇔ element i is in the set.

<p class="small">Union, intersection, membership, "remove the lowest element"… each in <b>one CPU instruction</b>.</p>

Note:
⏱ 0:57–1:00. Halim & Halim, CP3 §2.2 and §8.2. Works for n ≤ 64 (unsigned long long); std::bitset for more.

---

## Bitmask cheat sheet (C++)

```cpp [1-4|6-8|10-12]
bool has(int S, int i)  { return S >> i & 1; }        // i ∈ S ?
int  add(int S, int i)  { return S | (1 << i); }      // S ∪ {i}
int  del(int S, int i)  { return S & ~(1 << i); }     // S ;{i}
int  low(int S)         { return S & -S; }            // lowest element (as a bit)

for (int S = 0; S < (1 << n); S++) { /* every subset of n items */ }
for (int T = S; T; T = (T - 1) & S) { /* every non-empty submask of S */ }
__builtin_popcount(S);  __builtin_ctz(S);             // |S| , index of lowest bit

// DP over subsets (TSP, Held–Karp): dp[S][v] = shortest path visiting S, ending at v
// states 2^n · n, transitions n  →  O(2^n · n²)  instead of O(n!)
```

Note:
⏱ 1:05–1:10. Enumerating all submasks of all masks costs 3ⁿ total. Held–Karp with n = 20: 2²⁰·400 ≈ 4·10⁸ vs 20! ≈ 2.4·10¹⁸.

## Exit ticket

<div class="quiz" data-answer="3">
<p class="q">Iterative deepening is preferred over BFS mainly because…</p>
<ol><li>it is faster asymptotically</li><li>it finds cheaper solutions with arbitrary step costs</li><li>it needs only O(bd) memory with the same completeness and optimality (unit costs)</li><li>it never revisits nodes</li></ol>
<p class="explain">Time is O(bᵈ) for both; memory is the difference.</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">What does <code>x &amp; (x − 1)</code> compute?</p>
<ol><li>x − 1</li><li>x with its lowest set bit cleared</li><li>the lowest set bit of x</li><li>x divided by 2</li></ol>
<p class="explain">Subtracting 1 flips the lowest 1 and the zeros below it.</p>
</div>

## Takeaways

- Search = expand + test; strategies differ only in **which frontier node** comes next.
- **BFS**: complete, optimal (unit cost), O(bᵈ) memory. **DFS**: O(bm) memory, not complete/optimal.
- **IDS**: the best blind strategy for unknown depth. **UCS**: optimal for any positive costs.
- **Bitmasks**: sets as integers → fast backtracking (N-queens) and DP over subsets.
