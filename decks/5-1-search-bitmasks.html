## How can an agent choose? Four designs

<div class="cols">
<div class="card"><h4>Simple reflex</h4><p>Fixed rules: <i>if condition then action</i>. Thermostat: "if T &lt; 20 °C, turn on the heater". Fast, but blind to the future.</p></div>
<div class="card"><h4>Model-based reflex</h4><p>Also keeps an internal <b>model</b> of the world (what it can't see right now). Still reacts with rules.</p></div>
</div>
<div class="cols">
<div class="card fragment" style="border:2px solid var(--hot)"><h4>Goal-based ← today</h4><p>Has a <b>goal</b> and asks: <i>"if I do A, then B, then C… do I reach the goal?"</i> It <b>simulates sequences of actions</b> in its model before acting: that is <b>search</b> (and planning).</p></div>
<div class="card fragment"><h4>Utility-based / learning</h4><p>Prefers <b>better</b> outcomes, not just any goal (next sessions: costs, A*, optimization). Learning agents improve all of this from experience.</p></div>
</div>

Note:
⏱ 0:12–0:17. R&N 2.4. The river puzzle cannot be solved with a simple rule: the right first move only makes sense because of what comes three moves later. That is why we need to think ahead.

## The problem-solving agent

A goal-based agent works in four phases (R&N 3.1):

<div class="cols">
<div>

1. **Goal formulation** — what do I want? *Everyone on the right bank.*
2. **Problem formulation** — which states and actions do I consider? *Who is on each bank; boat trips.* <!-- .element: class="fragment" -->
3. **Search** — simulate sequences of actions in the model until one reaches the goal. <!-- .element: class="fragment" -->
4. **Execution** — carry out the solution, one action at a time. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Abstraction is the key</h4>
<p>We ignore the color of the boat, the weather, the speed of the river… We keep only what matters to decide. A good formulation makes the search space <b>small</b>.</p>
</div>
</div>

Note:
⏱ 0:19–0:22. In the GPS: goal = destination; states = cities or intersections; actions = drive a road; search = Dijkstra; execution = "in 300 m turn right".

## Formulating a problem: five ingredients

<div class="cols">
<div>

| ingredient | wolf, goat & cabbage |
|---|---|
| **states** | who is on each bank, e.g. WC \| FG |
| **initial state** | FWGC \| ∅ |
| **actions** | cross alone, or with one passenger from your bank |
| **transition model** | the result of an action: a new state |
| **goal test** | ∅ \| FWGC |
| **path cost** | 1 per crossing |

</div>
<div class="card fragment">
<h4>A solution</h4>
<p>A sequence of actions from the initial state to a goal state. An <b>optimal</b> solution has the lowest path cost.</p>
<p class="small muted">Unsafe states (the wolf with the goat, or the goat with the cabbage, without the farmer) are simply not allowed.</p>
</div>
</div>

Note:
⏱ 0:22–0:26. R&N 3.1.1. With 4 characters and 2 banks there are 2⁴ = 16 states; 6 of them are unsafe.

## Searching: a tree of "what ifs"

<div class="cols">
<div>

- Start at the initial state. **Expand** it: generate the states reachable with one action.
- The generated but not yet expanded nodes form the **frontier** (open list). <!-- .element: class="fragment" -->
- Repeat: pick a frontier node, test if it is a goal, otherwise expand it. <!-- .element: class="fragment" -->
- A **node** is a data structure (state, parent, action, cost g); a **state** is a configuration. The same state can appear in many nodes (repeated states). <!-- .element: class="fragment" -->

</div>
<div>

```text
TreeSearch(problem):
    frontier = { initial state }
    loop:
        if frontier is empty: return failure
        node = pick one from the frontier
        if goal(node): return solution(node)
        add expand(node) to the frontier
```

<p class="small"><b>The only difference between search strategies:</b> which node is picked next.</p>

</div>
</div>

Note:
⏱ 0:34–0:37. Keep an explored set to avoid repeated states (graph search). In the river puzzle without it, the farmer could go back and forth forever.

## Four criteria

| Criterion | Question |
|---|---|
| **Completeness** | Does it always find a solution when one exists? |
| **Optimality** | Does it find the lowest-cost solution? |
| **Time** | How many nodes are generated? |
| **Space** | How many nodes in memory at once? |

<p class="small">Measured with <b>b</b> = branching factor, <b>d</b> = depth of the shallowest goal, <b>m</b> = maximum depth.</p>

## The price of breadth

<div class="cols">
<div>

BFS generates 1 + b + b² + … + b<sup>d</sup> = **O(b<sup>d</sup>)** nodes — and keeps them all.

| depth | nodes | time | memory |
|---|---|---|---|
| 8 | 10⁸ | 2 min | 103 GB |
| 10 | 10¹⁰ | 3 h | 10 TB |
| 12 | 10¹² | 13 days | 1 PB |
| 16 | 10¹⁶ | 350 years | 10 EB |

</div>
<div class="card">
<h4>Lesson (Russell & Norvig)</h4>
<p>b = 10, one million nodes/s, 1 KB per node. <b>Memory runs out long before time does.</b></p>
</div>
</div>

Note:
⏱ 0:50–0:53. R&N, Fig. 3.13. Exponential-complexity search problems cannot be solved by uninformed methods for any but the smallest instances.

## Depth-limited & iterative deepening

<div class="cols">
<div>

**Depth-limited (DLS):** DFS that doesn't expand below depth ℓ. Outcomes: solution · failure · **cutoff**.

**Iterative deepening (IDS):** run DLS with ℓ = 0, 1, 2, … until a solution appears.

</div>
<div class="card">
<h4>Best of both worlds</h4>
<p>Complete and optimal (unit costs) like BFS, memory <b>O(bd)</b> like DFS.</p>
</div>
</div>

## Isn't IDS wasteful?

Nodes generated: $d\ b + (d-1)\ b^2 + \dots + 1 \cdot b^d = O(b^d)$

<div class="predict" data-answer="123450" data-tol="0">
<p class="q">b = 10, d = 5: IDS generates 5·10 + 4·100 + 3·1,000 + 2·10,000 + 1·100,000 = ?</p>
<p class="explain"><b>123,450</b> nodes vs 111,110 for BFS: only ~11% more, with exponentially less memory. Most nodes live at the bottom level, which IDS generates only once. R&N: "IDS is the preferred uninformed method when the search space is large and the depth of the solution is unknown."</p>
</div>

## Uniform-cost search & the summary

<p class="small"><b>Uniform cost (Dijkstra):</b> expand the frontier node with the smallest path cost g(n) — priority queue. Optimal for any positive step costs.</p>

| | BFS | Uniform cost | DFS | Depth-limited | IDS | Bidirectional |
|---|---|---|---|---|---|---|
| Complete? | yes¹ | yes¹² | no | no | yes¹ | yes¹ |
| Optimal? | yes³ | yes | no | no | yes³ | yes³ |
| Time | b<sup>d</sup> | b<sup>1+⌊C*/ε⌋</sup> | b<sup>m</sup> | b<sup>ℓ</sup> | b<sup>d</sup> | b<sup>d/2</sup> |
| Space | b<sup>d</sup> | b<sup>1+⌊C*/ε⌋</sup> | bm | bℓ | bd | b<sup>d/2</sup> |

<p class="tiny muted">¹ b finite · ² step costs ≥ ε &gt; 0 · ³ all step costs equal. (R&N, Fig. 3.21)</p>

Note:
⏱ 1:04–1:08. Bidirectional: two searches meeting in the middle — b^(d/2) + b^(d/2) ≪ b^d. Same idea as "meet in the middle" next session!

## Question

In backtracking and searching, each node keeps track of what I’ve already used: which columns 
are filled in, which cities I’ve already visited. 
How would you store that information so that copying, comparing, and looking it up 
would be virtually free?”

Answer: If there are only a few elements (n ≤ 64), a single integer can represent the entire set. <!-- .element: class="fragment" -->

## Bitmasks: a set in one integer

A subset of {0, 1, …, n−1} ↔ an n-bit integer: bit i = 1 ⇔ element i is in the set.

<p class="small">Union, intersection, membership, "remove the lowest element"… each in <b>one CPU instruction</b>.</p>

Note:
⏱ 1:11–1:13. Halim & Halim, CP3 §2.2 and §8.2. Works for n ≤ 64 (unsigned long long); std::bitset for more.

## Bitmask cheat sheet (C++)

```cpp [1-4|6-8|10-12]
bool has(int S, int i)  { return S >> i & 1; }        // i ∈ S ?
int  add(int S, int i)  { return S | (1 << i); }      // S ∪ {i}
int  del(int S, int i)  { return S & ~(1 << i); }     // S − {i}
int  low(int S)         { return S & -S; }            // lowest element (as a bit)

for (int S = 0; S < (1 << n); S++) { /* every subset of n items */ }
for (int T = S; T; T = (T - 1) & S) { /* every non-empty submask of S */ }
__builtin_popcount(S);  __builtin_ctz(S);             // |S| , index of lowest bit

// DP over subsets (TSP, Held–Karp): dp[S][v] = shortest path visiting S, ending at v
// states 2^n · n, transitions n  →  O(2^n · n²)  instead of O(n!)
```

Note:
⏱ 1:16–1:19. Enumerating all submasks of all masks costs 3ⁿ total. Held–Karp with n = 20: 2²⁰·400 ≈ 4·10⁸ vs 20! ≈ 2.4·10¹⁸.

 ## N-queens: three masks and a shift

<div class="cols">
<div>

```cpp
int n, all, cnt = 0;              // all = (1 << n) - 1
void solve(int cols, int ld, int rd) {
    if (cols == all) { cnt++; return; }
    int avail = all & ~(cols | ld | rd);
    while (avail) {
        int bit = avail & -avail;   // lowest free column
        avail -= bit;
        solve(cols | bit,
              (ld | bit) << 1,      // diagonals move
              (rd | bit) >> 1);     // one column per row
    }
}
```

</div>
<div>

- One queen **per row**; the state is just 3 integers.
- **cols**: columns already used. <!-- .element: class="fragment" -->
- **ld**, **rd**: columns of this row attacked along each diagonal. <!-- .element: class="fragment" -->
- Going down one row, every diagonal attack moves one column: a **single shift** moves all of them. <!-- .element: class="fragment" -->

</div>
</div>

Note:
Draw a queen on the board and its two diagonals: in the next row they hit columns c+1 and c−1, then c+2 and c−2… That is why ld shifts left and rd shifts right. ld may grow beyond n bits: harmless, because avail is ANDed with all.

## Takeaways

- A **goal-based agent** thinks ahead by **searching** a **state space** (states + actions + goal test + cost).
- Search = expand + test; strategies differ only in **which frontier node** comes next.
- **BFS**: complete, optimal (unit cost), O(bᵈ) memory. **DFS**: O(bm) memory, not complete/optimal.
- **IDS**: the best blind strategy for unknown depth. **UCS**: optimal for any positive costs.
- **Bitmasks**: sets as integers → fast backtracking (N-queens) and DP over subsets.
