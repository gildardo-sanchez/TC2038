## Iterative improvement

<div class="cols">
<div>

- Keep **one complete solution** (not a path).
- Define **neighbors**: small changes (swap two cities, flip a bit, move one queen).
- Move to a better neighbor; repeat.

</div>
<div class="card">
<h4>Why?</h4>
<p><b>O(1) memory</b>, works on huge or infinite spaces, gives a reasonable answer anytime. No optimality guarantee.</p>
<p class="muted">8-queens: 8⁸ ≈ 1.7·10⁷ states; TSP with 100 cities: 99!/2 ≈ 10¹⁵⁵ tours.</p>
</div>
</div>

Note:
⏱ 0:05–0:12. "Iterative enhancement" in the syllabus = iterative improvement / local search. Classic example: 2-opt for TSP (reverse a segment of the tour when that shortens it).

## Hill climbing

```text [1-2|3-5|6]
HillClimbing(problem):
    current ← initial state
    loop:
        neighbor ← best neighbor of current
        if value(neighbor) ≤ value(current): return current     ← stuck
        current ← neighbor
```

Note:
⏱ 0:12–0:20. Press ↓ for the animation. Press "New start" several times: depending on where it starts, it stops on different local maxima. Then switch to "Random restarts (×6)".

## The traps & the fixes

<div class="cols">
<div class="card"><h4>Traps</h4><p><b>Local maxima</b> · <b>plateaus</b> (flat: no direction) · <b>ridges</b> (every single step goes down).</p></div>
<div class="card"><h4>Fixes</h4><p><b>Sideways moves</b> (limited) · <b>random restarts</b> · <b>stochastic</b> hill climbing (random uphill neighbor) · <b>first-choice</b> (first better neighbor).</p></div>
</div>

<p class="small">8-queens (R&N): steepest ascent solves only <b>14%</b> of random starts (≈ 4 steps when it succeeds). With up to 100 sideways moves: <b>94%</b>. Random restarts: expected 1/p ≈ 7 restarts → essentially always solved.</p>

Note:
⏱ 0:20–0:28. Random-restart hill climbing is complete with probability approaching 1 (eventually it starts at a goal).

---

<div class="predict" data-answer="5" data-tol="0">
<p class="q">Each hill-climbing run succeeds with probability p = 0.2. Expected number of runs until the first success?</p>
<p class="explain">Geometric distribution: 1/p = <b>5</b> runs.</p>
</div>

<p class="q">Hill climbing stops when…</p>
<ol><li>it reaches the global maximum</li><li>the temperature reaches zero</li><li>no neighbor is better than the current state</li><li>after n iterations</li></ol>
<p class="explain">"Locally optimal" ≠ "globally optimal".</p>
</div>

## Simulated annealing (SA)

Metallurgy: heat a metal, cool it slowly → atoms settle into a low-energy crystal.

```text [2|3-6|7]
SimulatedAnnealing(problem, schedule):
    current ← initial;  T ← T₀
    while T > T_min:
        next ← RANDOM neighbor;  ΔE ← value(next) − value(current)
        if ΔE > 0: current ← next                        // better: always accept
        else: current ← next with probability e^(ΔE / T) // worse: sometimes!
        T ← α · T                                        // cool down (0.9 < α < 1)
```

Note:
⏱ 0:33–0:38. Metropolis et al. (1953) for the acceptance rule; Kirkpatrick, Gelatt & Vecchi (1983) for optimization (chip placement). Your GA slides start with this summary of SA.

## Acceptance probability

$$P(\text{accept worse move}) = e^{\Delta E / T}, \qquad \Delta E < 0$$

| ΔE | T = 10 | T = 1 | T = 0.1 |
|---|---|---|---|
| −1 | 0.90 | 0.37 | 0.00005 |
| −5 | 0.61 | 0.007 | ≈ 0 |

<p class="small">High T: explore. Low T: exploit. If T decreases slowly enough, SA reaches the global optimum with probability → 1 (in theory — "slowly enough" can be very slow).</p>

Note:
⏱ 0:45–0:48.

<div class="cols">
<div class="card"><h4>Genetic algorithms</h4><p>A <b>population</b> of candidate solutions evolves by <b>selection</b>, <b>crossover</b> and <b>mutation</b> (Holland, 1975).</p></div>
<div class="card"><h4>Ant colony optimization</h4><p>Many simple agents build solutions and share information through <b>pheromone</b> (Dorigo, 1992).</p></div>
</div>

## Genetic algorithm: the recipe

<div class="cols">
<div>

1. **Encode** a solution as a chromosome (bit string, permutation…).
2. **Fitness** function.
3. **Select** parents (roulette wheel, tournament).
4. **Crossover** (single point), **mutation** (flip bits with small p).
5. **Elitism**: copy the best unchanged. Repeat.

</div>
<div class="card">
<h4>Knapsack (your example)</h4>
<p>Chromosome = n bits (item in / out). Fitness = total value, or <b>0 if the weight exceeds W</b>.</p>
<p>Cost: O(P · G · F) for population P, G generations, fitness cost F.</p>
</div>
</div>

Note:
⏱ 1:02–1:06. From your "Genetic Algorithms" slides (based on arpitbhayani.me's genetic knapsack).

## Ant colony optimization (ACO)

<div class="cols">
<div>

- Each ant builds a tour city by city: from i to j with probability ∝ **τ<sub>ij</sub><sup>α</sup> · (1/d<sub>ij</sub>)<sup>β</sup>**.
- **Evaporation**: τ ← (1 − ρ)·τ.
- **Deposit**: each ant adds Q/L on the edges of its tour (shorter tours → more pheromone).

</div>
<div class="w" data-widget="aco" data-n="14" data-h="250"></div>
</div>

Note:
⏱ 1:15–1:27. Run: thick orange edges = strong pheromone; it converges to a good tour. Raise evaporation ρ: more exploration, slower convergence; very low ρ: early stagnation. Positive feedback is the key mechanism (your slides: real ants and the double-bridge experiment).

## Which tool?

| Situation | Choose |
|---|---|
| Need the optimum, small search space | Backtracking + pruning / B&B |
| n ≈ 40, subset-type problem | Meet in the middle |
| Shortest path with a good heuristic | A* (IDA* if memory is tight) |
| Huge space, a good solution is enough | Hill climbing + restarts, SA |
| Rugged landscape, solutions combine well | Genetic algorithm |
| Routing / graph problems, dynamic changes | Ant colony optimization |

Note:
⏱ 1:27–1:33. Course-wide synthesis. Ask pairs to defend one row with an example.

## Exit ticket

<div class="quiz" data-answer="4">
<p class="q">Simulated annealing escapes local maxima because…</p>
<ol><li>it uses a population</li><li>it restarts randomly</li><li>it uses a heuristic h(n)</li><li>it accepts worse moves with probability e^(ΔE/T), decreasing as T cools</li></ol>
<p class="explain">Controlled randomness: explore early, exploit late.</p>
</div>

Note:

---

## Takeaways

- **Local search** keeps one state and improves it: O(1) memory, anytime answers, no guarantees.
- **Hill climbing** gets stuck → sideways moves, **random restarts**.
- **Simulated annealing**: accept worse moves with **e^(ΔE/T)**; cool slowly.
- **GA** (selection, crossover, mutation) and **ACO** (pheromone, evaporation): population-based metaheuristics.

<p class="muted small">End of Unit 5.</p>
