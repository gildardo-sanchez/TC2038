## Warm-up: are these the same?

Two servers each hold a 10 GB file. The network is slow.

<div class="quiz" data-answer="3">
<p class="q">How do you check whether the files are identical?</p>
<ol><li>Send one file to the other server and compare byte by byte</li><li>Compare their sizes</li><li>Compute a short fingerprint (hash) of each and compare the fingerprints</li><li>Compare the first and last kilobyte</li></ol>
<p class="explain">Fingerprints: different hashes ⇒ surely different; equal hashes ⇒ equal with very high probability. That's the idea behind rsync, git, and Rabin–Karp.</p>
</div>

## Hash functions for strings

<div class="cols3">
<div class="card fragment"><h4>Sum of codes</h4><p>"abc" and "cab" collide; with keys ≤ 8 chars sums stay below 1,016 → most of a 10,000-slot table is never used.</p></div>
<div class="card fragment"><h4>First 3 letters</h4><p>26³ = 17,576 options, but real English uses only ≈ 2,851 → clustering.</p></div>
<div class="card fragment"><h4>Polynomial</h4><p>Every character, weighted by its position: <b>order matters</b>, values spread well.</p></div>
</div>

<p class="small fragment">Requirements: fast to compute, spreads keys evenly, deterministic. (Your hash-table slides.)</p>

Note:
⏱ 0:06–0:12. Hash tables give O(1) average insert/find; collisions handled by separate chaining or open addressing (linear/quadratic probing, double hashing) — CLRS ch. 11.

## The polynomial (rolling) hash

$$h(s) = \left(s_0\ p^{n-1} + s_1\ p^{n-2} + \dots + s_{n-1}\right) \bmod m$$

- p: a base larger than the alphabet (31 for lowercase letters, 53 for mixed case); m: a large prime (10⁹ + 7, 10⁹ + 9).
- **Horner's rule**: y ← y·p + sᵢ (mod m) — one multiplication per character. <!-- .element: class="fragment" -->

<div class="w" data-widget="hashcalc" data-text="abracadabra"></div>

Note:
⏱ 0:12–0:18. Your exercise: hash("abracadabra") with p = 31, m = 10⁹ + 7, and then with p = 2979, m = 10⁹ + 9. Students type it in. Map a = 1, …, z = 26 (never 0: otherwise "a" and "aa" would collide).

---

## Code

```cpp
const long long P = 31, M = 1'000'000'007;
long long polyHash(const string& s) {
    long long h = 0;
    for (char c : s) h = (h * P + (c - 'a' + 1)) % M;   // Horner
    return h;
}
```

<p class="small">Use 64-bit arithmetic: h·P stays below 9.2·10¹⁸.</p>

Note:
⏱ 0:18–0:25. Application from your slides: check whether N strings are all distinct by hashing them into a set — O(total length) expected.

## Rolling the window

Windows of length m: knowing h(T[s..s+m−1]), get the next one in **O(1)**:

$$t_{s+1} = \left(d\ \big(t_s - T[s]\ h\big) + T[s+m]\right) \bmod q, \qquad h = d^{m-1} \bmod q$$

<p class="small">Drop the leftmost digit, shift, add the new rightmost digit — like a sliding odometer.</p>

Note:
⏱ 0:30–0:35. CLRS uses d for the base (radix) and q for the modulus.

## Rabin–Karp (CLRS Fig. 32.5)

<div class="w" data-widget="rabinkarp"></div>

Note:
⏱ 0:35–0:47. CLRS's example: T = 2359023141526739921, P = 31415, q = 13. h(P) = 7. The window 31415 is a valid match; 67399 also hashes to 7 → spurious hit, rejected after comparing characters. Change q to 101 or 1009: spurious hits disappear.

## Analysis

<div class="cols">
<div>

- Preprocessing Θ(m), each window O(1).
- Every hash hit costs O(m) to verify.
- **Worst case** O((n − m + 1)·m): e.g., T = aⁿ, P = aᵐ (every window is a real hit) or an adversarial q.
- **Expected** O(n + m) with a large random prime q: spurious hits occur with probability ≈ 1/q per window.

</div>
<div class="card">
<h4>Where Rabin–Karp shines</h4>
<p><b>Many patterns</b> of the same length (put their hashes in a set), 2-D pattern matching, plagiarism detection (fingerprints of all k-grams).</p>
</div>
</div>

Note:
⏱ 0:47–0:52.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">A <b>spurious hit</b> in Rabin–Karp is…</p>
<ol><li>a real occurrence that the hash misses</li><li>a window whose hash equals h(P) but whose characters differ</li><li>an overflow in the rolling computation</li><li>a window that is skipped</li></ol>
<p class="explain">Equal hashes don't prove equal strings; different hashes do prove different strings. So Rabin–Karp never misses a match.</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="4">
<p class="q">Rabin–Karp (with verification) is…</p>
<ol><li>Monte Carlo: may report wrong matches</li><li>deterministic O(n)</li><li>always faster than KMP</li><li>Las Vegas: always correct; the time depends on how many hits happen</li></ol>
<p class="explain">Without the verification step it would be Monte Carlo (Unit 4: randomized algorithms).</p>
</div>

## Collisions: the birthday paradox

<div class="w" data-widget="birthday"></div>

Note:
⏱ 0:57–1:05. With 23 people, two share a birthday with probability > 50%. With m = 10⁹ + 7 and 10⁵ strings, a collision is very likely! Fixes: 64-bit modulus (2⁶¹ − 1), or two independent hashes (≈ 10¹⁸). Warning: hashing mod 2⁶⁴ (letting unsigned overflow) is broken by the Thue–Morse string — use a prime modulus and a random base.

## Any substring in O(1)

Precompute prefix hashes H[i] = h(s[0..i−1]) and powers pw[i] = pⁱ:

$$h(s[l..r)) = \big(H[r] - H[l]\cdot p^{r-l}\big) \bmod m$$

```cpp
vector<long long> H(n + 1, 0), pw(n + 1, 1);
for (int i = 0; i < n; i++) { H[i+1] = (H[i] * P + s[i]) % M;  pw[i+1] = pw[i] * P % M; }
auto sub = [&](int l, int r) { return ((H[r] - H[l] * pw[r - l]) % M + M) % M; };  // s[l..r)
```

<p class="small">Compare two substrings in O(1) · LCP of two suffixes by binary search in O(log n) · palindrome check with the reversed string's hashes.</p>

Note:
⏱ 1:05–1:15. These three tricks solve many "hard" contest problems in O(n log n), e.g., longest repeated substring by binary search on the length (next session we'll do it with suffix arrays).

## Hashing vs the exact algorithms

| Task | Exact tool | Hashing |
|---|---|---|
| One pattern | KMP / Z: Θ(n + m) | Rabin–Karp: O(n + m) expected |
| Many patterns, same length | Aho–Corasick | set of hashes |
| Compare two substrings | suffix array + LCP + RMQ | O(1) |
| Longest palindrome | Manacher O(n) | binary search + hash O(n log n) |

Note:
⏱ 1:15–1:22. Hashing: simpler code, probabilistic guarantee.

<p class="q">Why should the character values start at 1 (a = 1) rather than 0?</p>
<ol><li>With a = 0, "b", "ab", "aab" … would all get the same hash</li><li>Because ASCII starts at 1</li><li>To avoid overflow</li><li>It makes no difference</li></ol>
<p class="explain">Leading zeros don't change a number: 0·p² + 0·p + 2 = 2.</p>

## Exit ticket

<div class="quiz" data-answer="3">
<p class="q">You hash 10⁶ distinct strings modulo m = 10⁹ + 7. A collision is…</p>
<ol><li>essentially impossible</li><li>about 0.1% likely</li><li>almost certain (n²/2m ≈ 500)</li><li>impossible if p is prime</li></ol>
<p class="explain">Birthday paradox: collisions appear around n ≈ √m ≈ 3·10⁴. Use two moduli or a 61-bit prime.</p>
</div>

Note:
⏱ 1:33–1:40. Reading: CLRS 32.2; cp-algorithms "String hashing".

## Takeaways

- **Polynomial hash** with Horner: order-sensitive fingerprints; values from 1, prime modulus.
- **Rolling hash**: next window in O(1) → **Rabin–Karp**, expected O(n + m), always correct with verification.
- **Collisions** appear around √m strings — use double hashing or 2⁶¹ − 1.
- **Prefix hashes**: any substring's hash in O(1).
