## The string-matching problem (CLRS 32)

- Text **T[0..n−1]**, pattern **P[0..m−1]** over an alphabet Σ, usually n ≫ m.
- P **occurs with shift s** in T if T[s..s+m−1] = P. Such an s is a **valid shift**. <!-- .element: class="fragment" -->
- Goal: find **all** valid shifts. <!-- .element: class="fragment" -->

<p class="fragment small">Example: T = abacaabaccabacabaabb, P = abacab → the only valid shift is <b>s = 10</b>.</p>

| Algorithm | Preprocessing | Matching |
|---|---|---|
| Naive | 0 | O((n − m + 1)·m) |
| Rabin–Karp | Θ(m) | O((n − m + 1)·m) worst, O(n + m) expected |
| Finite automaton | O(m·\|Σ\|) | Θ(n) |
| **Knuth–Morris–Pratt** | **Θ(m)** | **Θ(n)** |

Note:
⏱ 0:06–0:10. CLRS Fig. 32.2. Rabin–Karp is session 2.4.

## Borders: prefixes that are also suffixes

A **border** of a string is a proper prefix that is also a proper suffix.

<div class="cols">
<div>

| string | longest border |
|---|---|
| abab | ab |
| ababa | aba |
| ababac | — (empty) |
| ababaca | a |

</div>
<div class="card fragment">
<h4>Why care?</h4>
<p>If P[0..j−1] matched and then P[j] fails, the next possible alignment puts the <b>longest border</b> of P[0..j−1] under the text we already matched. No need to re-read it.</p>
</div>
</div>

Note:
⏱ 0:25–0:30. Your slides with "ababaca": go through prefixes and suffixes in a table.

<div class="cols">
<div>

```text
T:  a b x a b c a b c a b y
P:        a b c a b y
                    ↑ mismatch: T[8] = c ≠ P[5] = y
matched "abcab" → its longest border is "ab"
P:              a b c a b y
                    ↑ continue comparing here (i did not move)
```

</div>
<div>

<p>The text pointer <b>i</b> never moves backward.</p>
<p>The pattern pointer <b>j</b> jumps to the border length: <b>j ← π[j − 1]</b>.</p>

## The prefix function π

π[i] = length of the longest proper prefix of P[0..i] that is also a suffix of P[0..i].

<div class="w" data-widget="prefixfn" data-pattern="ababaca"></div>

Note:
⏱ 0:35–0:45. CLRS example: π(ababaca) = 0 0 1 2 3 0 1. Step and ask: "what is k now? which border are we testing?" The fall-back k ← π[k−1] is KMP applied to the pattern itself.

---

## Computing π in Θ(m)

```cpp [1-2|3|4|5|6]
vector<int> prefixFunction(const string& P) {
    int m = P.size();  vector<int> pi(m, 0);
    for (int i = 1, k = 0; i < m; i++) {
        while (k > 0 && P[k] != P[i]) k = pi[k - 1];   // fall back to a shorter border
        if (P[k] == P[i]) k++;                         // extend the border
        pi[i] = k;
    }
    return pi;
}
```

<p class="small fragment"><b>Amortized:</b> k grows by at most 1 per iteration (≤ m − 1 total) and every fall-back decreases it → the while loop runs ≤ m times overall.</p>

Note:
⏱ 0:45–0:50. CLRS 32.4, potential-function argument.

## The KMP matcher

<div class="w" data-widget="kmp"></div>

Note:
⏱ 0:55–1:05. Same text as the naive slide: compare the comparison counts. Watch that i never decreases; on mismatch P slides by j − π[j−1]. After a full match, j = π[m−1] so overlapping occurrences are found (try T = aaaaa, P = aa).

## The code and the analysis

```cpp
vector<int> kmpSearch(const string& T, const string& P) {
    vector<int> pi = prefixFunction(P), res;
    for (int i = 0, j = 0; i < (int)T.size(); i++) {
        while (j > 0 && T[i] != P[j]) j = pi[j - 1];
        if (T[i] == P[j]) j++;
        if (j == (int)P.size()) { res.push_back(i - j + 1); j = pi[j - 1]; }
    }
    return res;
}
```

<div class="cols small">
<div class="card"><h4>Why ≤ 2n comparisons?</h4><p>Each comparison either advances i (≤ n times) or slides P to the right, increasing i − j (≤ n times).</p></div>
<div class="card"><h4>Total</h4><p>Θ(m) preprocessing + Θ(n) matching = <b>Θ(n + m)</b>, O(m) extra space, works as a stream.</p></div>
</div>

Note:
⏱ 1:05–1:12. KMP (1977): Knuth, Morris and Pratt; Morris had used it in a text editor around 1970.

## A neat trick: P # T

Compute π of the string **P + '#' + T** (with # not in the alphabet).

<p class="fragment">Every position where π = m marks an occurrence of P in T. One function, no separate matcher.</p>

<p class="fragment small muted">Same idea with the Z-function next session: z of P#T.</p>

Note:
⏱ 1:12–1:15.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="4">
<p class="q">In KMP, after a mismatch at pattern position j > 0, the text pointer i…</p>
<ol><li>goes back to i − j + 1</li><li>goes back j positions</li><li>advances by π[j − 1]</li><li>stays where it is; only j changes to π[j − 1]</li></ol>
<p class="explain">That's the whole point: the text is read left to right exactly once.</p>
</div>

## Exit ticket

<div class="quiz" data-answer="2">
<p class="q">KMP runs in Θ(n + m) because…</p>
<ol><li>it compares characters in parallel</li><li>the text pointer never moves back and the fall-backs are amortized against the advances</li><li>it uses hashing</li><li>it skips half of the text</li></ol>
<p class="explain">Amortized analysis: ≤ 2n comparisons in the matcher, ≤ 2m in the preprocessing.</p>
</div>

## Takeaways

- Naive matching wastes what it learned: Θ((n − m + 1)m) worst case.
- A **border** is a proper prefix that is also a suffix; **π[i]** stores the longest one for each prefix of P.
- **KMP**: on mismatch, j ← π[j − 1]; i never goes back → **Θ(n + m)**.
- Trick: π of **P#T** finds all occurrences.

<p class="muted small">Next: the Z-function — another linear-time view of the same idea.</p>
