## Three slower solutions

<div class="cols3">
<div class="card fragment"><h4>Brute force</h4><p>All O(n²) substrings, check each in O(n) → <b>O(n³)</b>.</p></div>
<div class="card fragment"><h4>Dynamic programming</h4><p>pal[i][j] = (s[i] = s[j]) and pal[i+1][j−1] → <b>O(n²)</b> time and space.</p></div>
<div class="card fragment"><h4>Expand around centers</h4><p>2n − 1 centers, expand while symmetric → <b>O(n²)</b> time, O(1) space.</p></div>
</div>

<p class="small fragment">Expanding from every center of <span class="mono">aibioibia</span> gives radii 1 1 3 1 9 1 3 1 1 (your slides): lots of re-checking of the same characters.</p>

## Expand around center

```cpp
int expand(const string& s, int L, int R) {      // returns palindrome length
    while (L >= 0 && R < (int)s.size() && s[L] == s[R]) { L--; R++; }
    return R - L - 1;
}
// for each i: best = max(best, expand(s, i, i), expand(s, i, i + 1))
```

<div class="predict" data-answer="19" data-tol="0">

<p class="explain">n character centers + (n − 1) gap centers = 2n − 1 = <b>19</b>. The # trick next turns all of them into character centers.</p>
</div>

## The # trick: only odd palindromes

Insert a separator between all characters and at both ends:

<p class="center mono big">abaccab → #a#b#a#c#c#a#b#</p>

- Every palindrome of the new string t has odd length and a center (a letter or a #).
- If the radius at position i of t is p[i], the original palindrome has **length p[i]** and starts at **(i − p[i]) / 2**. <!-- .element: class="fragment" -->

Note:
⏱ 0:25–0:32. "baccab" becomes "#b#a#c#c#a#b#", centered at the # between the two c's, radius 6.

## Mirrors

Let **[c − p[c], r]** be the palindrome that reaches **farthest to the right** found so far (center c, right end r).

For i inside it, its **mirror** is **i' = 2c − i**: by symmetry, the neighborhood of i looks like the neighborhood of i'.

<div class="cols3 small">
<div class="card fragment"><h4>Case 1 · p[i'] &lt; r − i</h4><p>Mirror palindrome strictly inside → <b>p[i] = p[i']</b>, no expansion possible.</p></div>
<div class="card fragment"><h4>Case 2 · p[i'] &gt; r − i</h4><p>Mirror sticks out on the left → only <b>r − i</b> is guaranteed; and in fact p[i] = r − i.</p></div>
<div class="card fragment"><h4>Case 3 · p[i'] = r − i</h4><p>Touches the border → start at r − i and <b>try to expand</b> beyond r.</p></div>
</div>

Note:
⏱ 0:32–0:45. Your slides: "length[i] ≥ length[i'], start expanding after that". The A B A B A B A example shows copying from the mirror.

## In one line

$$p[i] = \begin{cases} \min(r - i,\ p[2c - i]) & i \le r \\\\ 0 & i > r \end{cases} \quad\text{then expand; if } i + p[i] > r:\ c \leftarrow i,\ r \leftarrow i + p[i]$$

```cpp [1-2|3-4|5|6|7]
vector<int> manacher(const string& s) {            // radii on t = #s0#s1#...#
    string t = "#"; for (char ch : s) { t += ch; t += '#'; }
    int n = t.size(), c = 0, r = -1;  vector<int> p(n, 0);
    for (int i = 0; i < n; i++) {
        if (i <= r) p[i] = min(r - i, p[2 * c - i]);
        while (i - p[i] - 1 >= 0 && i + p[i] + 1 < n && t[i - p[i] - 1] == t[i + p[i] + 1]) p[i]++;
        if (i + p[i] > r) { c = i; r = i + p[i]; }
    }
    return p;                                      // max p[i] = longest palindrome length
}
```

## Why O(n)?

<div class="cols">
<div>

- Every successful expansion step at i pushes the right end **r** one position right.
- r only increases and r &lt; |t| = 2n + 1.
- Each i has at most one failed comparison.

<p class="big">⇒ O(n) time, O(n) space</p>

</div>
<div class="card">
<h4>Same pattern three times</h4>
<p>KMP (text pointer never goes back), Z-function (Z-box end r only moves right), Manacher (palindrome end r only moves right).</p>
</div>
</div>

## Exit ticket

<div class="quiz" data-answer="2">
<p class="q">Manacher's algorithm avoids re-comparing characters because…</p>
<ol><li>it uses a suffix array</li><li>inside the rightmost palindrome, radii are copied from mirror positions, and only the border r is ever expanded</li><li>it hashes all substrings</li><li>it only considers odd palindromes in the original string</li></ol>
<p class="explain">Symmetry + amortization.</p>
</div>

## Takeaways

- O(n³) brute force → O(n²) DP / expand-around-center → **O(n) Manacher**.
- **# trick**: every palindrome becomes odd; length = radius p[i].
- Keep the rightmost palindrome [c − p[c], r]; **mirror i' = 2c − i** gives p[i] ≥ min(r − i, p[i']).
- Three cases; only expansions at the border move r → linear.
