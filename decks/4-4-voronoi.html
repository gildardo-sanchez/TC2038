## The problem

<div class="cols">
<div>

Given a set S of n points (**sites**: the stores) and a new point q (our house), **find the site closest to q**.

- One query: compare with all n sites → O(n). <!-- .element: class="fragment" -->
- Millions of calls per day? Better: divide the city **once** into regions, one per store, and assign each address to the region it falls in. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Voronoi assignment model</h4>
<p>Every point of the plane is assigned to its <b>nearest site</b>. The subdivision of the plane that this rule induces is the <b>Voronoi diagram</b> of the sites.</p>
</div>
</div>

## Georgy F. Voronoi (1868–1908)

<div class="cols">
<div>

- Ukrainian–Russian mathematician; studied from 1889 at the University of Saint Petersburg, **student of Andrei Markov**.
- Defined these diagrams in general dimension in 1908. <!-- .element: class="fragment" -->
- The idea is older: Descartes (1644), Dirichlet (1850). That is why they are also called **Dirichlet tessellations** or **Thiessen polygons**. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>The same idea, everywhere</h4>
<p>John Snow's 1854 cholera map (the nearest water pump) · cell tissues and giraffe patterns · crystal growth · cellular-network coverage · meteorology (rain gauges) · robotics (paths far from obstacles) · nearest-neighbor classifiers in machine learning.</p>
</div>
</div>

## Start with two sites

<div class="cols">
<div>

- Distance in the plane: dist(p, q) = √((pₓ − qₓ)² + (p<sub>y</sub> − q<sub>y</sub>)²).
- The **bisector** of p and q: the line perpendicular to segment pq through its midpoint. Its points are **equally far** from p and q. <!-- .element: class="fragment" -->
- It splits the plane into two open **half-planes**: h(p, q) contains p, h(q, p) contains q. <!-- .element: class="fragment" -->
- r ∈ h(p, q) ⇔ dist(r, p) &lt; dist(r, q). <!-- .element: class="fragment" -->

</div>

## Definition and vocabulary

Sites P = {p₁, …, pₙ}, all distinct. The **Voronoi cell** of pᵢ is the set of points closer to pᵢ than to any other site:

$$\mathcal{V}(p_i) = \lbrace q : \operatorname{dist}(q,p_i) < \operatorname{dist}(q,p_j) \text{ for all } j \ne i \rbrace$$

<div class="cols3 small">
<div class="card fragment"><h4>Cells</h4><p>n cells, one per site — every site has one (its own position is in it).</p></div>
<div class="card fragment"><h4>Edges</h4><p>Pieces of bisectors: points equidistant from <b>2</b> sites. Segments or half-lines.</p></div>
<div class="card fragment"><h4>Vertices</h4><p>Points equidistant from <b>3 or more</b> sites: where edges meet.</p></div>
</div>

<p class="fragment">The <b>Voronoi diagram</b> Vor(P) is the subdivision of the plane into these cells.</p>

## Why are the cells convex?

<div class="cols">
<div>

Being in the cell of p means beating **every** other site:

$$\mathcal{V}(p_i) = \bigcap_{j \ne i} h(p_i, p_j)$$

- Each half-plane is convex. <!-- .element: class="fragment" -->
- The intersection of convex sets is convex. <!-- .element: class="fragment" -->
- So every cell is a **convex polygon** — possibly **unbounded** — with at most n − 1 edges. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Unbounded cells</h4>
<p>V(pᵢ) is unbounded ⇔ pᵢ is a vertex of the <b>convex hull</b> of P (last session!).</p>
<p class="small muted">Intuition: walk far away in a direction where pᵢ is extreme; eventually pᵢ is the nearest site. An interior site always has some site farther out that wins.</p>
</div>
</div>

## How big is Vor(P)?

<div class="cols">
<div>

Each cell has at most n − 1 edges, and there are n cells… so is the diagram **quadratic**?

<p class="fragment"><b>No — it is linear.</b> For n ≥ 3 sites (de Berg Thm 7.3):</p>
<p class="fragment big">≤ 2n − 5 vertices · ≤ 3n − 6 edges</p>
<p class="fragment small">On average a cell has fewer than 6 edges.</p>

</div>
<div class="card fragment">
<h4>Proof idea</h4>
<p>Add one vertex "at infinity" where all half-lines end. Now Euler's formula applies (V − E + F = 2, session 4.3!), with F = n cells. Every vertex has degree ≥ 3, so 2E ≥ 3V. Combine both → the bounds.</p>
</div>
</div>

Note:
⏱ 0:39–0:42. Your "Complexity of Voronoi diagram" slides: first the naive quadratic bound, then the surprise. Only sketch the proof.

## Largest empty circles

<div class="cols">
<div>

For a point q, the **largest empty circle** C(q) is the biggest circle centered at q with **no site inside**.

- q is a **Voronoi vertex** ⇔ C(q) has **3 or more** sites on its boundary.
- The bisector of pᵢ and pⱼ contains a **Voronoi edge** ⇔ some q on it has **exactly** pᵢ and pⱼ on the boundary of C(q).

</div>
<div class="card">
<h4>Application</h4>
<p>Where should the chain open a new store, as far as possible from all existing ones? At a <b>Voronoi vertex</b> (or on the city's boundary): the center of the largest empty circle.</p>
</div>
</div>

## Cost of the naive algorithm

<div class="cols">
<div>

```text
NaiveVoronoi(P):
    for each site pᵢ:                         // n times
        V(pᵢ) = intersection of the n − 1
                half-planes h(pᵢ, pⱼ)         // O(n log n)
```

- Intersecting N half-planes takes **O(N log N)** (divide and conquer, like the convex hull). <!-- .element: class="fragment" -->
- n cells × O(n log n) = **O(n² log n)**. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Can we do better?</h4>
<p>The output has only O(n) size, but we spend O(n² log n). Lower bound: <b>Ω(n log n)</b> — sites on a line give the sorted order, so a faster algorithm would sort faster.</p>
<p>Goal: <b>O(n log n)</b>.</p>
</div>
</div>

## Algorithm 2 · Divide and conquer

Shamos & Hoey, 1975

---

## The plan

<div class="cols">
<div>

1. **Divide** S by a vertical line into S₁ (left) and S₂ (right), about n/2 sites each.
2. **Conquer**: compute Vor(S₁) and Vor(S₂) recursively.
3. **Combine** them into Vor(S). <span class="hot">How?</span>

</div>
<div class="card fragment">
<h4>Lemma</h4>
<p>If S₁ and S₂ are separated by a vertical line, there is a <b>y-monotone polygonal chain c</b> such that every point to its left is in the cell of a site of S₁, and every point to its right in the cell of a site of S₂.</p>
<p class="small">c is made of the Voronoi edges between a left site and a right site.</p>
</div>
</div>

Note:
⏱ 1:02–1:05. Same pattern as merge sort and closest pair (session 4.1): all the cleverness is in the combine step.

---

## Merging: walking down the chain

<div class="w" data-widget="vordc" data-n="12" data-h="350"></div>

Note:
⏱ 1:05–1:15. Your step-by-step sequence. (1) Start very high on the dividing line: that point is in the cell of p (left) and q (right) — p and q are the endpoints of the UPPER common tangent of the two convex hulls. (2) Walk down along the bisector of p and q. (3) When the walk hits an orange edge (of Vor(S₁)), we enter the cell of another left site: update p; when it hits a blue edge, update q. Go to 2. (4) Finally, delete the orange parts to the right of c and the blue parts to the left. Ask before each step: "will p or q change next?"

---

## The algorithm and its cost

```text
VoronoiDiagram(S):                      // S presorted by x once: O(n log n)
    if |S| is small: solve directly
    split S into S₁, S₂ by the median x              // O(1)
    V₁ = VoronoiDiagram(S₁);  V₂ = VoronoiDiagram(S₂)  // 2 T(n/2)
    c  = dividing chain of V₁ and V₂                 // O(n)
    remove V₁ right of c and V₂ left of c            // O(n)
    return V₁ ∪ V₂ ∪ c
```

<div class="cols3 small">
<div class="card fragment"><h4>Linear merge</h4><p>The walk crosses each edge of V₁ and V₂ a constant number of times, and both diagrams have linear size.</p></div>
<div class="card fragment"><h4>Recurrence</h4><p>T(n) = 2T(n/2) + O(n) → <b>O(n log n)</b>, the same as merge sort.</p></div>
<div class="card fragment"><h4>Optimal</h4><p>Matches the Ω(n log n) lower bound. <span class="muted">Fortune's sweep (1987) is another O(n log n) method, used by most libraries (de Berg 7.2).</span></p></div>
</div>

Note:
⏱ 1:15–1:19. Your "Complexity" slides. The O(n) merge needs a good representation (each cell knows its edges in order, e.g. a DCEL) so that the walk can find the next edge without searching.

<ol><li>Each Voronoi cell is the intersection of n − 1 half-planes, so it is convex</li><li>A Voronoi diagram of n sites can have Θ(n²) edges</li><li>Every Voronoi cell is bounded</li><li>The naive algorithm already runs in O(n log n)</li></ol>
<p class="explain">Linear size (≤ 3n − 6 edges); hull sites have unbounded cells; naive is O(n² log n), divide and conquer O(n log n).</p>

## Takeaways

- **Vor(P)**: each cell = the points nearest to one site = ∩ of half-planes → **convex**; unbounded ⇔ hull site.
- Edges: equidistant from **2** sites; vertices: from **3+** sites (centers of empty circles).
- **Linear size**: ≤ 2n − 5 vertices, ≤ 3n − 6 edges.
- Naive: one cell at a time, **O(n² log n)**. Divide and conquer with a linear merge along the chain c: **O(n log n)**, optimal.

<p class="muted small">Next: the dual of the Voronoi diagram — Delaunay triangulations — and randomized algorithms.</p>
