## Terrains

<div class="cols">
<div>

- A **terrain** is a surface in 3-D where every vertical line hits it **at most once**: the graph of a height function f(x, y).
- We don't know f everywhere: only at a finite set P of **sample points** (GPS, surveys, satellites). <!-- .element: class="fragment" -->
- To estimate the height anywhere: **triangulate** P, **lift** each point to its height (each triangle becomes a flat piece of the surface) and, inside a triangle, average its 3 corners. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>A model used everywhere</h4>
<p>GIS calls it a <b>TIN</b> (triangulated irregular network). The same idea gives the meshes of 3-D models in games and animation, and the meshes engineers use to simulate heat, stress or air flow (finite elements).</p>
</div>
</div>

Note:
⏱ 0:08–0:12. Your "Motivation" and "Approximating terrain" slides. A topographic map with contour lines is another view of the same function.

## What is a triangulation?

<div class="cols">
<div>

A **triangulation** of a point set P is a set of triangles such that:

- their corners are exactly the points of P,
- they do not overlap (interiors are disjoint), <!-- .element: class="fragment" -->
- together they cover the **convex hull** of P — no more edges can be added without crossings. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>How many triangles?</h4>
<p>Always the same! With n points, k of them on the hull, <b>every</b> triangulation has</p>
<p class="big">2n − 2 − k triangles</p>
<p>and 3n − 3 − k edges (de Berg Thm 9.1, from Euler's formula).</p>
</div>
</div>

<div class="predict fragment" data-answer="10" data-tol="0">
<p class="q">The warm-up: n = 10 points, k = 8 on the hull. How many triangles?</p>
<p class="explain">2·10 − 2 − 8 = <b>10</b> — in A and in B.</p>
</div>

Note:
⏱ 0:12–0:16. Your "Triangulation" slide. The number of triangulations is huge (exponential: a convex polygon with n vertices already has a Catalan number of them, about 4ⁿ; no set has more than 30ⁿ), so we cannot try them all.

## More about triangulations

Triangulation of a vertex set P is a set of triangles whose vertices collectively are P, whose interiors do not intersect,  
and whose union is the **convex hull** of P. 

There are exponentially many different triangulations of P. 

Nevertheless, some triangulations look more natural than others.

## Good triangles, bad triangles

<div class="cols">
<div>
<svg viewBox="0 0 420 170" style="width:100%;max-height:190px">
<polygon points="20,150 120,150 70,65" style="fill:var(--ok-soft);stroke:var(--ok);stroke-width:3"/>
<polygon points="160,150 400,150 380,125" style="fill:var(--bad-soft);stroke:var(--bad);stroke-width:3"/>
<text x="25" y="40" font-size="16" style="fill:var(--ok)">fat: all angles ≈ 60°</text>
<text x="190" y="100" font-size="16" style="fill:var(--bad)">skinny: a tiny angle</text>
</svg>

- A skinny triangle joins samples that are **far apart** and leaves a nearby point to be estimated from far-away data.
- In simulations, skinny triangles cause **numerical errors**. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>How to compare triangulations</h4>
<p>Collect all the angles of all triangles and sort them increasingly: the <b>angle vector</b> (same length for every triangulation of P).</p>
<p>Prefer the triangulation whose <b>smallest angle is largest</b>; on a tie, compare the second smallest, and so on.</p>
<p>There are finitely many triangulations, so a best one — <b>angle-optimal</b> — exists.</p>
</div>
</div>

## Boris Delaunay (1890–1980)

<div class="cols">
<div>

- Russian mathematician (Борис Делоне), who continued Georgy **Voronoi**'s work.
- In 1934 he defined the triangulation by an **empty-sphere** condition, in a paper dedicated to Voronoi's memory ("Sur la sphère vide"). <!-- .element: class="fragment" -->
- Also a famous **mountaineer** — fitting for today's terrain example. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>The idea in one sentence</h4>
<p>Among the exponentially many triangulations of P, pick the one where <b>every triangle has an empty circumcircle</b>: no other point inside.</p>
</div>
</div>

Note:
⏱ 0:25–0:27. Your "Delaunay triangulation" slide.

## Legal and illegal edges

<div class="w" data-widget="edgeflip" data-h="300"></div>

Note:
⏱ 0:36–0:44. Edge ab is shared by triangles abc and abd. Drag d: when d enters the circle through a, b, c, edge ab becomes ILLEGAL (red), and the other diagonal cd has a larger smallest angle (orange ring = smallest angle). Symmetric: d inside circle(abc) ⇔ c inside circle(abd). If the quadrilateral is not convex, the edge cannot be flipped (and it is legal). de Berg Lemma 9.4.

## Algorithm 1: flip until legal (Lawson, 1977)

<div class="cols">
<div>

```text
LegalTriangulation(T):
    while T has an illegal edge ab:
        let abc and abd be its two triangles
        flip: remove ab, add cd
    return T
```

- **Theorem**: a triangulation with **no illegal edge** is a Delaunay triangulation, and it is **angle-optimal** (de Berg Thms 9.8–9.9). <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Does it ever stop?</h4>
<p>Every flip makes the angle vector <b>larger</b>, so we never see the same triangulation twice — and there are finitely many. So it stops.</p>
<p>At most O(n²) flips: each pair of points can become an edge, and be flipped away, at most once.</p>
</div>
</div>

Note:
⏱ 0:48–0:51. Your "Flip algorithm (Lawson)" and "Legal triangulation" slides. Trivial implementation O(n³); with care O(n²) — too slow for millions of points: we'll do better.

## Delaunay = dual of Voronoi

<div class="w" data-widget="voronoi" data-n="9" data-delaunay="1" data-h="280"></div>

- Join two sites **iff their Voronoi cells share an edge** → the **Delaunay graph**. In general position it is the Delaunay triangulation.
- A Delaunay triangle's circumcircle is empty → its **center is a Voronoi vertex** (last session's largest empty circles!).

Note:
⏱ 0:58–1:02. Your Voronoi/dual slides. Turn on "Empty circles at vertices": each circle passes through the 3 corners of a Delaunay triangle and contains no site. So computing one gives the other in O(n).

## Why everyone uses Delaunay

<div class="cols3">
<div class="card"><h4>Fattest triangles</h4><p>Maximizes the smallest angle over all triangulations (and minimizes the largest circumcircle): best for interpolating terrains and for simulation meshes.</p></div>
<div class="card"><h4>Contains useful graphs</h4><p>The Euclidean <b>minimum spanning tree</b> ⊆ DT (Unit 3: run Kruskal on its ≤ 3n edges → O(n log n)); the closest pair is a DT edge.</p></div>
<div class="card"><h4>Lifting map</h4><p>Lift each point to the paraboloid (x, y, x² + y²): the <b>lower convex hull</b> in 3-D, seen from below, is the DT (session 4.3's polytopes).</p></div>
</div>

<p class="small">Libraries: <b>Triangle</b> (Shewchuk), <b>Qhull</b>, <b>CGAL</b>. Used in GIS, games and graphics, finite elements, robotics, surface reconstruction from 3-D scans.</p>

Note:
⏱ 1:02–1:05. Your "Properties" and "Implementation" slides. If a smooth curve or surface is sampled densely enough, its DT contains a good reconstruction of it (3-D scanning).

## Randomized algorithms

An algorithm that **flips coins**. The input is fixed; the randomness is inside the algorithm.

<div class="cols">
<div class="card fragment"><h4>Las Vegas</h4><p>Always <b>correct</b>; the <b>running time</b> is random → we analyze the <i>expected</i> time.</p><p class="muted">Randomized quicksort, randomized incremental Delaunay.</p></div>
<div class="card fragment"><h4>Monte Carlo</h4><p>Fixed running time; the <b>answer</b> may be wrong (or approximate) with small probability. Repeat to reduce the error.</p><p class="muted">Estimating π or integrals by sampling, Karger's min cut, Miller–Rabin primality.</p></div>
</div>

Note:
⏱ 1:08–1:10. Computers generate pseudorandom numbers: fine for algorithms, not for cryptography. In C++ use std::mt19937, not rand().

Note:
Contract random edges until 2 super-vertices remain; one trial finds the minimum cut with probability ≥ 2/(n(n−1)). Repeat T = n² ln n times → failure probability ≤ 1/n.

## Las Vegas: why randomize the order?

<div class="cols">
<div>

**Randomized quicksort**: pick the pivot at random.

- The worst case is still O(n²)… but **no input** is bad: the **expected** time is O(n log n) for every input.
- An adversary cannot build a killer input, because they don't know our coin flips.

</div>
<div class="card">
<h4>Same trick for Delaunay</h4>
<p>Insert the points one by one, in <b>random order</b>. The result is always the Delaunay triangulation (Las Vegas); only the work depends on the order.</p>
</div>
</div>

Note:
⏱ 1:14–1:16.

## Algorithm 2: randomized incremental construction

<div class="cols">
<div>

```text
Delaunay(P):
    T = huge triangle p₀ p₋₁ p₋₂ around all of P
    for each p in P, in random order: Insert(p, T)
    remove p₀, p₋₁, p₋₂ and their edges
```

```text
Insert(p, T):
    find the triangle of T that contains p
    connect p to its corners
    legalize the edges opposite to p (flip if illegal)
```

</div>
<div>

## Why the random order works

<div class="cols">
<div>

- Think **backwards**: the last point inserted is a **random** point of the current set.
- Its work ∝ its degree; in any planar triangulation the **average degree is < 6** (fewer than 3n edges, each counted twice).
- So each insertion makes **O(1) changes in expectation**.

</div>
<div class="card">
<h4>Results (de Berg 9.3–9.4)</h4>
<p>Expected triangles created ≤ <b>9n + 1</b>.</p>
<p>Expected time <b>O(n log n)</b>, including point location; expected space O(n).</p>
<p>A bad order (e.g., points sorted along a parabola) can cost Θ(n²).</p>
</div>
</div>

Note:
⏱ 1:27–1:30. "Backwards analysis": instead of asking how costly it is to ADD a point, ask how costly it is to REMOVE a random one from the final triangulation.

## Unit 4 map

| Problem | Algorithm we saw | Time | Key idea |
|---|---|---|---|
| Closest pair | divide & conquer | O(n log n) | 2δ strip, ≤ 7 neighbors |
| All segment intersections | sweep line | O((n + k) log n) | test neighbors only |
| Range search | kd-tree | O(√n + k) | split by medians |
| Convex hull | Graham / Jarvis | O(n log n) / O(nh) | turn tests |
| Line arrangement | incremental | O(n²) | duality |
| Voronoi diagram | divide & conquer | O(n log n) | dividing chain |
| Delaunay triangulation | flips / randomized incremental | O(n²) / O(n log n) expected | empty circles |

## Takeaways

- Same points → **many triangulations**, all with **2n − 2 − k** triangles; prefer **fat** triangles (max-min angle).
- **Delaunay**: every triangle has an **empty circumcircle** ⇔ no illegal edge ⇔ angle-optimal. Inside the circle = bigger angle (inscribed angle theorem).
- Flip until legal (Lawson): O(n²). **Randomized incremental**: O(n log n) expected — a Las Vegas algorithm.
- Delaunay is the **dual of Voronoi** and the **lower hull of the lifted points**.
