## Vocabulary (CLRS B.4)

<div class="cols">
<div>

- **G = (V, E)**: vertices and edges. We measure input size by **|V|** and **|E|**.
- **Directed** (digraph): ordered pairs (u, v). **Undirected**: unordered pairs. <!-- .element: class="fragment" -->
- **Weighted**: a cost w(u, v) per edge — distance, time, money, risk… <!-- .element: class="fragment" -->
- **Path**, **simple path**, **cycle**; **connected** / **strongly connected**. <!-- .element: class="fragment" -->

</div>
<div>

- **Complete graph** Kₙ: an edge between every pair → n(n − 1)/2 edges. <!-- .element: class="fragment" -->
- **Sparse**: |E| ≈ |V|. **Dense**: |E| ≈ |V|². <!-- .element: class="fragment" -->
- **DAG**: directed acyclic graph. <!-- .element: class="fragment" -->
- **Tree**: connected and acyclic → exactly |V| − 1 edges. <!-- .element: class="fragment" -->

</div>
</div>

Note:
⏱ 0:07–0:12. From your intro slides. Emphasize that "O(V + E)" is the gold standard for graph algorithms: you can't do better than reading the input.

## Two representations

<div class="w" data-widget="graphrep" data-h="300"></div>

Note:
⏱ 0:12–0:20. Click vertex 2: its row in the matrix and its list. Toggle Directed: the matrix stops being symmetric and each edge appears in only one list. Matrix: Θ(V²) space, O(1) "is (u, v) an edge?". Lists: Θ(V + E) space, iterate over neighbors in O(deg u). Weighted: store w instead of 1 (∞ or NIL for no edge).

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">A social network has |V| = 10⁶ users and each one has about 100 friends. Which representation, and roughly how much memory?</p>
<ol><li>Matrix: about 10⁸ cells</li><li>Lists: about 10¹² entries</li><li>Lists: about 2·10⁸ entries (each friendship stored twice)</li><li>Either one, they cost the same</li></ol>
<p class="explain">E ≈ 10⁶·100/2 = 5·10⁷ friendships → 10⁸ list entries (≈ 2·10⁸ with the vertex array and pointers). The matrix would need 10¹² cells: a terabit even with 1 bit per cell.</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">Which operation is O(1) with an adjacency matrix but O(deg u) with adjacency lists?</p>
<ol><li>Visit all neighbors of u</li><li>Is (u, v) an edge?</li><li>Add a new vertex</li><li>Count all edges</li></ol>
<p class="explain">Lookup A[u][v]. Visiting all neighbors costs Θ(V) per vertex with a matrix, which is why BFS/DFS on a matrix take Θ(V²).</p>
</div>

## Breadth-first and depth-first search

<div class="w" data-widget="traverse" data-mode="bfs" data-h="290"></div>

Note:
⏱ 0:25–0:40. CLRS Fig. 22.3 (BFS) — numbers above vertices are distances from s. Then switch to DFS: labels are discovery/finish times (CLRS 22.3). BFS uses a FIFO queue → layers → shortest paths in number of edges. DFS uses a stack (or recursion) → goes deep first; the parenthesis theorem: discovery/finish intervals are either nested or disjoint. Both Θ(V + E) with adjacency lists.

---

## The code, side by side

<div class="cols">
<div>

```cpp
// BFS: layers, shortest #edges
vector<vector<int>> adj;  vector<int> d;
void bfs(int s) {
    d.assign(adj.size(), -1);
    queue<int> Q;  d[s] = 0;  Q.push(s);
    while (!Q.empty()) {
        int u = Q.front();  Q.pop();
        for (int v : adj[u])
            if (d[v] == -1) {
                d[v] = d[u] + 1;  Q.push(v);
            }
    }
}
```

</div>
<div>

```cpp
// DFS: discovery / finish times
vector<int> disc, fin;  int t = 0;
void dfs(int u) {
    disc[u] = ++t;
    for (int v : adj[u])
        if (!disc[v]) dfs(v);
    fin[u] = ++t;
}
```

</div>
</div>

<p class="small">Each vertex enters the queue / the recursion once, and each list is scanned once → <b>Θ(V + E)</b>.</p>

Note:
⏱ 0:36–0:40. Typical uses: BFS → unweighted shortest paths, bipartiteness (2-coloring, session 3.5), augmenting paths in Edmonds–Karp (3.6). DFS → cycle detection, topological sort, strongly connected components, articulation points.

## Topological sort of a DAG

<div class="w" data-widget="traverse" data-mode="topo" data-h="290"></div>

Note:
⏱ 0:40–0:47. CLRS Fig. 22.7: Professor Bumstead getting dressed. TOPOLOGICAL-SORT = run DFS, and as each vertex finishes, insert it at the front of a linked list. Order by decreasing finish time. Why it works: for every edge (u, v) in a DAG, f[v] < f[u] (no back edges). A cycle makes it impossible: you cannot put on the shoes before the socks AND the socks before the shoes. Watch is isolated: it can go anywhere.

## Part 2 · Tries

Searching strings by their prefixes

---

## Why a special structure for strings?

<div class="cols">
<div>

- Numbers: 112 < 467 is one O(1) comparison.
- Strings: comparing costs O(min(|s₁|, |s₂|)) — a BST of n words pays that on every one of its O(log n) comparisons. <!-- .element: class="fragment" -->
- And lexicographic order does not reflect similarity: Western > Eastern. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Trie (re<b>trie</b>val)</h4>
<p>A rooted tree where each edge is a character and each node is a <b>prefix</b>. Words with the same prefix share the path.</p>
<p class="muted">Fredkin (1960). Pronounced "try" (or "tree").</p>
<p>Uses: autocomplete, spell checkers, IP routing (longest prefix match), bioinformatics, search engines.</p>
</div>
</div>

Note:
⏱ 0:52–0:57. From your trie slides.

## Implementation

<div class="cols">
<div>

```cpp
struct Node {
    array<Node*, 26> next{};  // or map<char, Node*>
    bool isWord = false;
};
void insert(Node* root, const string& w) {
    Node* n = root;
    for (char c : w) {
        int k = c - 'a';
        if (!n->next[k]) n->next[k] = new Node();
        n = n->next[k];
    }
    n->isWord = true;
}
```

<p class="small"><b>find</b>: the same loop, but return false on a null pointer; at the end return n-&gt;isWord.</p>

</div>
<div>

| operation | time |
|---|---|
| insert w | O(\|w\|) |
| search w | O(\|w\|) |
| prefix p? | O(\|p\|) |
| delete w | O(\|w\|) |
| build W words of avg. length L | O(W·L) |

<p class="small">Independent of how many words are stored! Space: O(W·L·|Σ|) with arrays, O(W·L) with maps or hash tables.</p>

</div>
</div>

Note:
⏱ 1:07–1:12. Array children: fastest, wasteful for sparse alphabets (26 pointers per node). Map / unordered_map: compact. Compressed tries (radix / Patricia trees) merge chains of single-child nodes. A trie of all suffixes is a suffix trie → suffix tree / suffix array (session 2.5).

## Takeaways

- Graph size = **|V| + |E|**. Lists for sparse graphs, matrix for dense graphs or O(1) edge queries.
- **BFS** (queue) → layers, unweighted shortest paths. **DFS** (stack) → discovery/finish times. Both **Θ(V + E)**.
- **Topological sort** = decreasing DFS finish times; exists iff the graph is a DAG.
- **Trie**: one node per prefix; insert/search/delete in **O(|w|)**; end-of-word marks handle prefixes.
