## What is computational geometry?

> The systematic study of **algorithms and data structures for geometric objects**, with a focus on **exact** algorithms that are **asymptotically fast**. — de Berg et al.

- Born in the **1970s** (Shamos' thesis, 1978) as a generalization of 1-D sorting and searching to many dimensions. <!-- .element: class="fragment" -->
- Mostly 2-D and 3-D; mostly **flat objects**: points, segments, polygons, planes, polyhedra. <!-- .element: class="fragment" -->
- Discrete flavor: combinatorics + data structures, not numerical analysis. <!-- .element: class="fragment" -->

Note:
⏱ 0:08–0:11. The term was perhaps first used by Minsky & Papert in "Perceptrons"; today it means the algorithmic subfield.

## How geometric algorithms are designed

<div class="cols3">
<div class="card fragment"><h4>1 · Ignore degeneracies</h4><p>Assume general position: no 3 collinear points, no vertical segments, no 4 cocircular points. Understand the geometry.</p></div>
<div class="card fragment"><h4>2 · Handle degeneracies</h4><p>Adjust the algorithm so it stays correct for the special cases.</p></div>
<div class="card fragment"><h4>3 · Implement</h4><p>Build on a few <b>primitive operations</b> (left/right of a line, inside a circle…) and make them <b>robust</b>.</p></div>
</div>

Note:
⏱ 0:15–0:18. Good solutions combine (a) a thorough understanding of geometric properties and (b) proper algorithmic techniques and data structures.

<p class="q">A "degenerate case" in computational geometry is…</p>
<ol><li>an input that makes the algorithm run in worst-case time</li><li>a bug in the floating-point unit</li><li>a special configuration such as three collinear points or two points with the same x</li><li>a problem in more than 3 dimensions</li></ol>
<p class="explain">Degeneracies are "unlucky coincidences" of the input. Designing first under general position, then fixing them, is the standard method (de Berg ch. 1).</p>
</div>

## The most important primitive

Given a directed line from **p** to **q**: is **r** to the **left**, to the **right**, or **on** the line?

<p class="small muted">Convex hulls, segment intersection, triangulations, point-in-polygon… all of them reduce to this question.</p>

Note:
⏱ 0:22–0:24.

## Orientation = sign of a determinant

$$\operatorname{orient}(p,q,r)=\begin{vmatrix} q_x-p_x & r_x-p_x \\\\ q_y-p_y & r_y-p_y \end{vmatrix} = (q_x-p_x)(r_y-p_y)-(q_y-p_y)(r_x-p_x)$$

<div class="w" data-widget="orient"></div>

Note:
⏱ 0:24–0:32. Drag the points (they snap to the integer grid). > 0: counter-clockwise (left turn); < 0: clockwise (right turn); = 0: collinear. The absolute value is twice the area of the triangle — a nice "why it works": the cross product of the vectors pq and pr.

## In code

```cpp [1-4|6-9]
struct Pt { long long x, y; };
long long orient(Pt p, Pt q, Pt r) {           // exact with integers
    return (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
}

bool leftTurn(Pt p, Pt q, Pt r)  { return orient(p, q, r) > 0; }
bool rightTurn(Pt p, Pt q, Pt r) { return orient(p, q, r) < 0; }
bool collinear(Pt p, Pt q, Pt r) { return orient(p, q, r) == 0; }
```

<p class="small">No angles, no trigonometry, no division: <b>2 multiplications and 5 subtractions</b>.</p>

Note:
⏱ 0:36–0:38. With integer coordinates up to 10⁹ the products fit in 64 bits (up to ~4·10¹⁸). Stress: never compute angles with atan2 to decide a turn.

## Do two segments intersect?

Segments ab and cd intersect (properly) iff **c and d lie on opposite sides of ab** AND **a and b lie on opposite sides of cd**.

<div class="w" data-widget="segtest"></div>

Note:
⏱ 0:38–0:44. Drag the endpoints. Show the "same side" case (no intersection although the LINES intersect), and the collinear-touching case (orientation 0 → check the bounding box).

## Robustness: when floating point lies

<div class="cols">
<div>

- orient(p, q, r) with `double` may return the **wrong sign** when the points are almost collinear.
- Algorithms then make **inconsistent decisions** → crashes, holes in meshes, infinite loops.

</div>
<div class="card">
<h4>Remedies</h4>
<p>· Integer / rational coordinates (exact)</p>
<p>· Exact predicates with adaptive precision (Shewchuk)</p>
<p>· Libraries: <b>CGAL</b>, Fade2D, Boost.Geometry</p>
</div>
</div>

Note:
⏱ 0:44–0:48. Classic demo (Kettner et al., "Classroom examples of robustness problems"): orientation of points near (0.5, 0.5) on a fine floating-point grid produces a fractal-looking pattern of wrong signs. In contests: use integers whenever possible.

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="4">
<p class="q">Segments ab and cd: orient(a,b,c) &gt; 0, orient(a,b,d) &gt; 0. What can we conclude?</p>
<ol><li>They intersect</li><li>They intersect only if they are parallel</li><li>We need the other two tests to decide</li><li>They do not intersect: c and d are on the same side of ab</li></ol>
<p class="explain">If both endpoints of cd are strictly left of ab, the whole segment cd is left of the line ab → no intersection.</p>
</div>

## Proximity: the closest pair

Given n points in the plane, find the two that are **closest** to each other.

<p class="small">Air-traffic control, collision warnings, clustering, duplicate detection.</p>

<div class="predict" data-answer="499500" data-tol="0">
<p class="q">Brute force with n = 1,000 points: how many distances?</p>
<p class="explain">n(n−1)/2 = 499,500 → Θ(n²). With n = 10⁶ that's 5·10¹¹. We can do <b>Θ(n log n)</b>.</p>
</div>

Note:
⏱ 0:58–1:01.

## Warm-up in 1-D

<div class="cols">
<div>

Points on a line: **sort** them, then the closest pair is one of the **n − 1 consecutive pairs**.

O(n log n).

</div>
<div class="card">
<h4>Why doesn't this work in 2-D?</h4>
<p>Sorting by x puts far-apart points next to each other, and close points can be far apart in the order. We need <b>divide and conquer</b>.</p>
</div>
</div>

Note:
⏱ 1:01–1:03. Connect with Unit 1 (divide and conquer, master theorem).

## Divide & conquer in 2-D

1. **Divide** by the vertical line through the median x.
2. **Conquer**: closest pair on each side → δ = min(δ<sub>L</sub>, δ<sub>R</sub>). <!-- .element: class="fragment" -->
3. **Combine**: a better pair must cross the line → both points lie in the **strip of width 2δ**. <!-- .element: class="fragment" -->
4. Sort the strip by y; compare each point only with the **next 7** in that order. <!-- .element: class="fragment" -->

<details class="fragment"><summary>Why at most 7?</summary>
Consider the δ × 2δ rectangle above a strip point p. Split it into 8 squares of side δ/2. Two points in the same square would be at distance ≤ δ/√2 &lt; δ — impossible, since they'd be on the same side. So at most 8 points (including p) fit: p is compared with at most 7 others.
</details>

Note:
⏱ 1:03–1:08.

## Complexity

$$T(n) = 2\ T(n/2) + O(n) \quad\Rightarrow\quad T(n) = O(n \log n)$$

- Pre-sort once by x **and** once by y; split the y-sorted list in O(n) at each level.
- If we sort the strip at every level: T(n) = 2T(n/2) + O(n log n) = O(n log² n).
- Lower bound Ω(n log n) in the algebraic decision-tree model (element uniqueness reduces to it).

Note:
⏱ 1:15–1:20. Same master-theorem case as merge sort: a = 2, b = 2, d = 1.

## Takeaways

- Computational geometry = **exact**, **asymptotically fast** algorithms on geometric objects.
- Design: general position first → degeneracies → **robust primitives**.
- **orient(p, q, r)**: one determinant decides left / right / collinear — and segment intersection.
- **Closest pair** in Θ(n log n) by divide & conquer with a 2δ strip.
