## Definition

Sites P = {p₁, …, pₙ}. The **Voronoi cell** of pᵢ:

$$\mathcal{V}(p_i) = \lbrace q : \operatorname{dist}(q,p_i) < \operatorname{dist}(q,p_j) \text{ for all } j \ne i \rbrace$$

<div class="cols">
<div class="fragment">

The **bisector** of p and q splits the plane into two open half-planes; h(p, q) is the one containing p.

</div>
<div class="card fragment">
<h4>Key observation</h4>
<p>$\mathcal{V}(p_i) = \bigcap_{j \ne i} h(p_i, p_j)$</p>
<p>An intersection of half-planes → a (possibly unbounded) <b>convex polygon</b> with ≤ n − 1 edges.</p>
</div>
</div>

Note:
⏱ 0:07–0:13. Georgy Voronoy (1868–1908), student of Markov in St. Petersburg; Dirichlet (1850) and Descartes (1644) had used similar ideas.

<p class="explain">The only disconnected case (de Berg Thm 7.2). Otherwise the diagram is connected and its edges are segments or half-lines.</p>

## How big is Vor(P)?

<div class="cols">
<div>

Each cell can have up to n − 1 edges… is the total Θ(n²)?

<p class="fragment"><b>No — it's linear.</b> For n ≥ 3 (de Berg Thm 7.3):</p>
<p class="fragment big">≤ 2n − 5 vertices · ≤ 3n − 6 edges</p>

</div>
<div class="card fragment">
<h4>Proof idea</h4>
<p>Add a vertex at infinity to close unbounded edges, apply Euler's formula (V − E + F = 2), and use that every vertex has degree ≥ 3: 2E ≥ 3V.</p>
</div>
</div>

Note:
⏱ 0:21–0:25. Average cell has fewer than 6 edges. Ask: "Which sites have unbounded cells?" → answer on next slide.

## Largest empty circles

<div class="cols">
<div>

C<sub>P</sub>(q): the largest circle centered at q with no site inside.

- q is a **Voronoi vertex** ⇔ C<sub>P</sub>(q) has **≥ 3 sites** on its boundary.
- The bisector of pᵢ, pⱼ contains a **Voronoi edge** ⇔ some q on it has C<sub>P</sub>(q) with **exactly pᵢ, pⱼ** on its boundary.
- 𝒱(pᵢ) is **unbounded** ⇔ pᵢ is on the **convex hull** of P.

</div>
<div class="card">
<h4>Application</h4>
<p>Where to open a new store (or a new antenna) as far as possible from existing ones? At a <b>Voronoi vertex</b> (or on the boundary of the region): the center of the largest empty circle.</p>
</div>
</div>

Note:
⏱ 0:25–0:35. de Berg Thm 7.4. Go back two slides and turn on "Empty circles at vertices" to see them. Connection with session 24: unbounded cells ↔ hull vertices.

## Computing Vor(P)

<div class="cols3">
<div class="card fragment"><h4>Naive</h4><p>Each cell = intersection of n − 1 half-planes in O(n log n).</p><p><b>O(n² log n)</b></p></div>
<div class="card fragment"><h4>Divide & conquer</h4><p>Shamos & Hoey (1975): split by x, recurse, merge the two diagrams along a dividing chain in O(n).</p><p><b>O(n log n)</b></p></div>
<div class="card fragment"><h4>Fortune's sweep</h4><p>Fortune (1987): a plane sweep with a twist. Simpler to implement.</p><p><b>O(n log n)</b> · optimal</p></div>
</div>

<p class="small fragment">Lower bound Ω(n log n): sorting reduces to it (points on a line give the sorted order).</p>

Note:
⏱ 0:40–0:48. Your old slides develop the D&C algorithm in detail; mention it and move to Fortune, which follows de Berg.

## Why a plain sweep fails

<div class="cols">
<div>

A horizontal line sweeping down: the part of the diagram **above** the line…

<p class="fragment">…still depends on sites <b>below</b> the line, that we haven't seen yet!</p>
<p class="fragment">A Voronoi vertex can be found by the sweep line <b>before</b> the sites that define it.</p>

</div>
<div class="card fragment">
<h4>Fortune's fix</h4>
<p>Only keep the part of the diagram that <b>can no longer change</b>: points closer to some site above ℓ than to ℓ itself. They can't be closer to any site below ℓ.</p>
</div>
</div>

Note:
⏱ 0:48–0:52.

## The beach line

- Points equidistant from a site p and the sweep line ℓ form a **parabola** with focus p.
- The boundary of the "finished" region is the **lower envelope** of these parabolas: the **beach line** (a sequence of parabolic arcs). <!-- .element: class="fragment" -->
- The **breakpoints** between arcs trace out the Voronoi edges as ℓ moves down. <!-- .element: class="fragment" -->

Note:
⏱ 0:52–0:56. Mental image: each site sends a wave; the beach line is where the sea of "settled" points meets the water ahead.

## Two kinds of events

<div class="cols">
<div class="card"><h4>Site event</h4><p>ℓ reaches a new site → a <b>new arc</b> appears on the beach line (splitting the arc above it). The only way arcs appear. <b>n</b> of them, known in advance.</p></div>
<div class="card"><h4>Circle event</h4><p>Three consecutive arcs' sites define a circle; when ℓ reaches its <b>lowest point</b>, the middle arc vanishes and a <b>Voronoi vertex</b> appears at the center. Discovered on the fly (some are false alarms).</p></div>
</div>

<p class="small">Data structures: event queue (priority queue) · beach line in a balanced BST (leaves = arcs) · the diagram in a DCEL. Each event costs O(log n), there are O(n) events → <b>O(n log n)</b> time, <b>O(n)</b> space (de Berg Thm 7.10).</p>

Note:
⏱ 1:06–1:12. The beach line has at most 2n − 1 arcs (each site event adds at most 2).

---

<p class="explain">The circle through three sites is empty and touches ℓ: its center is equidistant from 3 sites and ℓ.</p>
</div>

## Geometric search: the post-office problem

Preprocess n post offices so that, for any query point q, we find the **nearest one fast**.

<div class="cols">
<div class="card fragment"><h4>Answer</h4><p>Build Vor(P), then do <b>point location</b>: which cell contains q?</p></div>
<div class="card fragment"><h4>Cost</h4><p>Planar point location (de Berg ch. 6, trapezoidal maps): O(n) storage, <b>O(log n)</b> expected query.</p></div>
</div>

Note:
⏱ 1:17–1:22. Knuth's original "post-office problem" (1973).

---

## Point location: the slab idea

<div class="cols">
<div>

1. Draw vertical lines through every vertex → **slabs**.
2. Inside a slab, the edges don't cross → they're **ordered** top to bottom.
3. Query: binary search the slab by x, then binary search the edge by y → **O(log n)**.

</div>
<div class="card">
<h4>Trade-off</h4>
<p>Slabs need O(n²) storage in the worst case. Trapezoidal maps (randomized incremental) get <b>O(n) storage</b> with O(log n) expected query — next session's randomization idea!</p>
</div>
</div>

Note:
⏱ 1:22–1:27. Same "preprocess once, query many times" pattern as kd-trees in session 23.

## Takeaways

- **Vor(P)**: each cell = points nearest to one site = ∩ of half-planes → convex.
- Linear size: **≤ 2n − 5 vertices, ≤ 3n − 6 edges**. Vertices = centers of empty circles through 3 sites.
- **Fortune's sweep**: beach line of parabolas; site & circle events → **O(n log n)**, optimal.
- **Post office**: Voronoi + point location → nearest site in O(log n).

<p class="muted small">Next: the dual of the Voronoi diagram — Delaunay triangulations — and randomized algorithms.</p>
