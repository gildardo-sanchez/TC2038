## Spanning trees

- A **spanning tree** of a connected, undirected G = (V, E) is a subset of edges that forms a tree containing **all** vertices → |V| − 1 edges.
- A graph can have many spanning trees (Kₙ has nⁿ⁻² of them — Cayley). <!-- .element: class="fragment" -->
- **MST**: a spanning tree of minimum total weight w(T) = Σ w(u, v). <!-- .element: class="fragment" -->
- Not connected? One tree per component: a **spanning forest**. <!-- .element: class="fragment" -->

<p class="fragment small">Brute force over all spanning trees is hopeless; greedy works here — and we can prove it.</p>

Note:
⏱ 0:06–0:10.

## The generic method (CLRS 23.1)

<div class="cols">
<div>

```text
GENERIC-MST(G, w)
  A = ∅
  while A is not a spanning tree
      find an edge (u, v) that is SAFE for A
      A = A ∪ {(u, v)}
  return A
```

<p class="small"><b>Invariant:</b> A is a subset of some MST. An edge is <b>safe</b> if adding it keeps the invariant.</p>

</div>
<div class="card">
<h4>The two algorithms differ in the rule</h4>
<p><b>Prim:</b> A is always a single tree; add the cheapest edge leaving it.</p>
<p><b>Kruskal:</b> A is a forest; add the cheapest edge joining two different trees.</p>
</div>
</div>

Note:
⏱ 0:10–0:15.

## Cuts and light edges

<div class="cols">
<div>

- A **cut** (S, V − S) is a partition of the vertices.
- An edge **crosses** the cut if one endpoint is on each side. <!-- .element: class="fragment" -->
- A cut **respects** A if no edge of A crosses it. <!-- .element: class="fragment" -->
- A **light edge** is a crossing edge of minimum weight. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Cut property (Theorem 23.1)</h4>
<p>If A ⊆ some MST and the cut (S, V − S) respects A, then <b>any light edge crossing the cut is safe</b> for A.</p>
<p class="small muted">Proof (exchange): take an MST T without the light edge (u, v). The path u ⇝ v in T crosses the cut on some edge (x, y). Swap (x, y) for (u, v): still a spanning tree, weight does not increase.</p>
</div>
</div>

Note:
⏱ 0:15–0:25. Draw the exchange argument on the board with the CLRS graph. Your slide asked: "Is (h, g) safe initially?" Yes — it is the lightest edge overall, so it is light for any cut separating h from g.

<p class="q">Every edge weight in G is distinct. Which edge is certainly in the MST?</p>
<ol><li>The heaviest edge</li><li>The edge with the median weight</li><li>The lightest edge</li><li>None is guaranteed</li></ol>
<p class="explain">It is light for any cut that separates its endpoints. (With distinct weights, the MST is unique.)</p>

<p class="q">The heaviest edge of a cycle…</p>
<ol><li>is always in the MST</li><li>can be left out of some MST (cycle property)</li><li>must be in every spanning tree</li><li>makes the MST undefined</li></ol>
<p class="explain">Kruskal will discard it: when it is reached, its endpoints are already connected by lighter edges.</p>
</div>

## Prim: the code

<div class="cols" style="grid-template-columns:1.7fr 1fr">
<div>

```cpp
// adj[u] = {(v, w)}; returns the MST weight
long long prim(const vector<vector<pair<int,int>>>& adj) {
    int n = adj.size();
    vector<int> key(n, INT_MAX);  vector<bool> inT(n, false);
    priority_queue<pair<int,int>, vector<pair<int,int>>, greater<>> pq;
    key[0] = 0;  pq.push({0, 0});
    long long total = 0;
    while (!pq.empty()) {
        auto [k, u] = pq.top();  pq.pop();
        if (inT[u]) continue;
        inT[u] = true;  total += k;
        for (auto [v, w] : adj[u])
            if (!inT[v] && w < key[v]) { key[v] = w;  pq.push({w, v}); }
    }
    return total;
}
```

</div>
<div class="small">

<div class="card"><h4>Déjà vu?</h4><p>It is Dijkstra's code! The only change: the key is <b>w(u, v)</b>, not d[u] + w(u, v).</p></div>

<div class="card fragment"><h4>Cost</h4><p><b>O(E log V)</b> with a binary heap; <b>O(V²)</b> with an array (dense graphs); O(E + V log V) with a Fibonacci heap.</p></div>

</div>
</div>

Note:
⏱ 0:42–0:48. Common student bug: copying Dijkstra and leaving d[u] + w.

## Disjoint sets (union–find)

<div class="cols">
<div>

```cpp
vector<int> parent, rnk;
int find(int x) {                       // path compression
    return parent[x] == x ? x : parent[x] = find(parent[x]);
}
bool unite(int a, int b) {              // union by rank
    a = find(a);  b = find(b);
    if (a == b) return false;           // same tree → cycle
    if (rnk[a] < rnk[b]) swap(a, b);
    parent[b] = a;
    if (rnk[a] == rnk[b]) rnk[a]++;
    return true;
}
// Kruskal
sort(edges.begin(), edges.end());       // by weight
for (auto [w, u, v] : edges)
    if (unite(u, v)) total += w;
```

</div>
<div>

- MAKE-SET, FIND-SET, UNION.
- With both heuristics: **O(α(n))** amortized per operation; α ≤ 4 for any n in this universe. <!-- .element: class="fragment" -->
- Kruskal: **O(E log E) = O(E log V)**, dominated by the sort. <!-- .element: class="fragment" -->

</div>
</div>

Note:
⏱ 0:58–1:08. α is the inverse Ackermann function (CLRS 21.4). Without union by rank and path compression a FIND can cost O(V).

## Prim or Kruskal?

| | Prim | Kruskal |
|---|---|---|
| grows | one tree | a forest |
| needs | priority queue | sort + union–find |
| time | O(E log V), O(V²) with array | O(E log V) |
| best for | dense graphs | sparse graphs, edges already sorted |
| bonus | — | stop at k trees → k clusters |

Note:
⏱ Quick comparison, 1 minute.

## Exit ticket

<div class="quiz" data-answer="1">
<p class="q">What is the key difference between Prim and Dijkstra?</p>
<ol><li>Prim's key is the weight of the single edge to the tree; Dijkstra's is the total distance from the source</li><li>Prim works on directed graphs only</li><li>Dijkstra is greedy and Prim is not</li><li>There is no difference</li></ol>
<p class="explain">Same skeleton, different key. An MST does NOT give shortest paths, and a shortest-path tree is not an MST.</p>
</div>

Note:
⏱ 1:33–1:40. Reading: CLRS 23.1–23.2, 21.3.

## Takeaways

- **Cut property**: a light edge crossing a cut that respects A is safe → greedy is optimal.
- **Prim**: one growing tree + priority queue, **O(E log V)** (O(V²) with an array).
- **Kruskal**: sorted edges + **union–find**, **O(E log V)**; near-constant α(n) per operation.
- Every MST of a graph has the **same total weight**.
