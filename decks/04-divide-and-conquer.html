# Divide and conquer

### Split · solve · combine — and how to analyze it with recurrences

<p class="byline">Dr. Gildardo Sánchez Ante · Tecnológico de Monterrey</p>

## Austerlitz, December 2, 1805

<div class="cols">
<div>

- Austro-Russian army: ~15,000 more soldiers than Napoleon.
- They attacked the French right flank. <!-- .element: class="fragment" -->
- Napoleon drove into their **center** and **split** them in two. <!-- .element: class="fragment" -->
- Each half alone was no match → both were defeated. <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>The algorithmic lesson</h4>
<p>A big instance can be hard. Two instances of <b>half the size</b> may each be easy — if combining the answers is cheap.</p>
</div>
</div>

Note:
⏱ 0:02–0:05. Story from Neapolitan & Naimipour, "Foundations of Algorithms", ch. 2.

## The pattern

<div class="cols3">
<div class="card"><h4>Divide</h4><p>Split the instance of size n into a subproblems of size n/b.</p></div>
<div class="card"><h4>Conquer</h4><p>Solve each subproblem <b>recursively</b> (small ones directly).</p></div>
<div class="card"><h4>Combine</h4><p>Build the solution of the original instance from the partial solutions.</p></div>
</div>

<p>Examples: merge sort · quicksort · binary search · tree traversals · Karatsuba (big integers) · Strassen (matrices) · closest pair · convex hull.</p>

<p class="callout">D&C naturally leads to a <b>recursive algorithm</b> → its running time is a <b>recurrence</b>.</p>

Note:
⏱ 0:05–0:10.

## Example 1 · find the maximum

<div class="cols">
<div>

**Iterative**

```cpp
int maxIter(const vector<int>& a) {
    int m = a[0];
    for (int i = 1; i < a.size(); i++)
        if (a[i] > m) m = a[i];
    return m;
}
```

</div>
<div>

**Divide and conquer**

```cpp [1|2|3-5|6]
int maxDC(const vector<int>& a, int lo, int hi) {
    if (lo == hi) return a[lo];          // base case
    int mid = (lo + hi) / 2;             // divide
    int L = maxDC(a, lo, mid);           // conquer
    int R = maxDC(a, mid + 1, hi);
    return max(L, R);                    // combine
}
```

</div>
</div>

Note:
⏱ 0:10–0:14. Step the highlighted lines. Ask: which one does fewer comparisons? (Trick: both do exactly n − 1.)

## From code to recurrence

Let T(n) = number of comparisons for n elements.

$$T(n) = \begin{cases} 0 & n = 1 \\\\ 2\ T(n/2) + 1 & n > 1 \end{cases}$$

<p class="fragment">Unroll it: T(n) = 2T(n/2) + 1 = 4T(n/4) + 2 + 1 = 8T(n/8) + 4 + 2 + 1 = …</p>
<p class="fragment">After log₂n levels: T(n) = n·T(1) + (n/2 + … + 2 + 1) = <b>n − 1 = Θ(n)</b></p>

Note:
⏱ 0:22–0:27. Recurrences are equations defined in terms of themselves. There's no universal method; for D&C the master theorem covers most cases. References for solving recurrences: Aspnes' notes (Yale) "SolvingRecurrences", Baker's notes (SFU).

---

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="2">
<p class="q">Which recurrence describes maxDC's running time?</p>
<ol>
<li>T(n) = T(n − 1) + 1</li>
<li>T(n) = 2T(n/2) + Θ(1)</li>
<li>T(n) = 2T(n/2) + Θ(n)</li>
<li>T(n) = T(n/2) + Θ(1)</li>
</ol>
<p class="explain">Two recursive calls on halves, constant combine (one comparison). Option A is the recursive "max of first n−1" from last session.</p>
</div>

## Example 2 · search

Given a **sorted** array A and a value x, return the position of x in A, or −1.

<div class="cols">
<div class="card fragment"><h4>Sequential search</h4><p>Check A[0], A[1], … → up to <b>n</b> comparisons. Θ(n)</p></div>
<div class="card fragment"><h4>Binary search</h4><p>Compare with the middle, discard half → about <b>log₂ n</b>. Θ(log n)</p></div>
</div>

Note:
⏱ 0:30–0:32. Sequential search ignores that the array is sorted.

## Binary search

```cpp [1-2|3-4|5|6|7]
int binarySearch(const vector<int>& A, int x) {
    int lo = 0, hi = A.size() - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;          // avoids overflow
        if (A[mid] == x) return mid;
        if (x < A[mid]) hi = mid - 1;          // keep left half
        else            lo = mid + 1;          // keep right half
    }
    return -1;
}
```

Note:
⏱ 0:32–0:35. Why lo + (hi − lo)/2 instead of (lo + hi)/2? Overflow for huge arrays — a famous bug in Java's library that went unnoticed for nine years.

## Recurrence for binary search

$$T(n) = T(n/2) + 1, \qquad T(1) = 1$$

<p class="fragment">T(n) = T(n/2) + 1 = T(n/4) + 2 = T(n/8) + 3 = … = T(n/2ᵏ) + k</p>
<p class="fragment">Stop when n/2ᵏ = 1 → k = log₂ n → <b>T(n) = log₂ n + 1 = Θ(log n)</b></p>

<div class="predict fragment" data-answer="20" data-tol="1">
<p class="q">Worst case comparisons for 1,000,000 sorted elements?</p>
<p class="explain">⌊log₂ 10⁶⌋ + 1 = 20. Sequential search may need 1,000,000.</p>
</div>

Note:
⏱ 0:40–0:45.

## The master theorem

For $T(n) = a\ T(n/b) + \Theta(n^{d})$ with $a \ge 1$, $b > 1$, $d \ge 0$:

$$T(n) = \begin{cases} \Theta(n^{d}) & \text{if } d > \log_b a \\\\ \Theta(n^{d} \log n) & \text{if } d = \log_b a \\\\ \Theta(n^{\log_b a}) & \text{if } d < \log_b a \end{cases}$$

<div class="cols3 small">
<div class="card fragment"><h4>Root wins</h4><p>Combine work dominates.</p></div>
<div class="card fragment"><h4>Tie</h4><p>Same work on every level × log n levels.</p></div>
<div class="card fragment"><h4>Leaves win</h4><p>The number of subproblems explodes.</p></div>
</div>

Note:
⏱ 0:45–0:50. a = number of subproblems, b = shrink factor, d = exponent of the divide+combine work. Intuition: level k of the recursion tree does aᵏ · (n/bᵏ)ᵈ work; compare a with bᵈ.

1. **Divide** the array into two halves of n/2 items.
2. **Conquer**: sort each half recursively (size 1 is already sorted).
3. **Combine**: **merge** the two sorted halves into one sorted array.

## Merge in C++

```cpp [1-3|4-6|7-8|9]
void merge(vector<int>& a, int lo, int mid, int hi) {
    vector<int> S;  S.reserve(hi - lo + 1);
    int i = lo, j = mid + 1;
    while (i <= mid && j <= hi)                      // compare the fronts
        if (a[i] <= a[j]) S.push_back(a[i++]);       // <= keeps it stable
        else              S.push_back(a[j++]);
    while (i <= mid) S.push_back(a[i++]);            // leftovers
    while (j <= hi)  S.push_back(a[j++]);
    copy(S.begin(), S.end(), a.begin() + lo);
}
void mergeSort(vector<int>& a, int lo, int hi) {
    if (lo >= hi) return;
    int mid = lo + (hi - lo) / 2;
    mergeSort(a, lo, mid);  mergeSort(a, mid + 1, hi);
    merge(a, lo, mid, hi);
}
```

Note:
⏱ 1:12–1:15. "<=" makes merge sort stable. Extra memory Θ(n).

---

## Complexity of merge sort

$$T(n) = 2\ T(n/2) + \Theta(n)$$

<div class="cols">
<div>

- Level 0: one merge of size n → **n**
- Level 1: two merges of n/2 → **n** <!-- .element: class="fragment" -->
- Level 2: four merges of n/4 → **n** <!-- .element: class="fragment" -->
- … log₂ n levels <!-- .element: class="fragment" -->

</div>
<div class="card fragment">
<h4>Master theorem</h4>
<p>a = 2, b = 2, d = 1 → log₂2 = 1 = d</p>
<p class="big">Θ(n log n)</p>
</div>
</div>

Note:
⏱ 1:15–1:20. Every level costs n; there are log n levels.

## Exit ticket

<div class="quiz" data-answer="4">
<p class="q">1 · Which algorithm is <b>not</b> divide and conquer?</p>
<ol><li>Binary search</li><li>Merge sort</li><li>Quicksort</li><li>Insertion sort</li></ol>
<p class="explain">Insertion sort grows a sorted prefix one element at a time (decrease-and-conquer by 1), it doesn't split into subproblems of size n/b.</p>
</div>

Note:
⏱ 1:30–1:40. Three questions (↓).

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="1">
<p class="q">2 · Binary search requires…</p>
<ol><li>A sorted array with random access</li><li>A linked list</li><li>Distinct elements</li><li>An array whose size is a power of 2</li></ol>
<p class="explain">Sorted, so discarding half is safe; random access, so the middle is O(1).</p>
</div>

--

<!-- .slide: class="checkpoint" -->
<div class="quiz" data-answer="3">
<p class="q">3 · T(n) = 3T(n/3) + n solves to…</p>
<ol><li>Θ(n)</li><li>Θ(n²)</li><li>Θ(n log n)</li><li>Θ(n^1.58)</li></ol>
<p class="explain">log₃3 = 1 = d → Θ(n log n). Same as merge sort with three parts.</p>
</div>

## Takeaways

- D&C: **divide** into a subproblems of size n/b, **conquer** recursively, **combine**.
- Its cost is a **recurrence**: $T(n) = a\ T(n/b) + \Theta(n^{d})$.
- **Master theorem**: compare d with log_b a.
- Max: Θ(n) · Binary search: Θ(log n) · Merge sort: Θ(n log n).
